<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EASY หมี่ไก่ฉีก</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
<meta name="theme-color" content="#E5232B">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  :root {
    --red: #E5232B;
    --red-dark: #C81D24;
    --yellow: #FFC928;
    --bg: #F5F7FB;
    --white: #FFFFFF;
    --soft: #F9FAFB;
    --border: #E5E7EB;
    --text: #1F2937;
    --text-secondary: #6B7280;
    --danger: #FF5A4F;
    --green-dark: #16A34A;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Prompt', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .pin-header {
    background: var(--red);
    padding: 60px 24px 40px;
    text-align: center;
    border-radius: 0 0 36px 36px;
    flex-shrink: 0;
  }

  .logo-easy { font-size: 42px; font-weight: 700; color: var(--yellow); letter-spacing: -1px; line-height: 1; margin-bottom: 6px; }
  .logo-sub { font-size: 14px; color: rgba(255,255,255,0.85); font-weight: 300; }
  .pin-header-desc { font-size: 13px; color: rgba(255,255,255,0.65); font-weight: 300; margin-top: 4px; }

  .pin-body {
    flex: 1; padding: 32px 24px 24px;
    display: flex; flex-direction: column; align-items: center;
  }

  .pin-label { font-size: 14px; color: var(--text-secondary); font-weight: 400; margin-bottom: 20px; }

  .pin-dots { display: flex; gap: 16px; margin-bottom: 36px; }

  .pin-dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--border); background: transparent;
    transition: all 0.2s ease;
  }
  .pin-dot.filled { background: var(--red); border-color: var(--red); transform: scale(1.15); }
  .pin-dot.error { background: var(--danger); border-color: var(--danger); animation: shake 0.35s ease; }

  @keyframes shake {
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-5px)}
    60%{transform:translateX(5px)}
  }

  .pin-keypad {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 12px; width: 100%; max-width: 300px; margin-bottom: 16px;
  }

  .pin-key {
    aspect-ratio: 1; border: 1.5px solid var(--border);
    border-radius: var(--radius); background: var(--white);
    font-family: 'Prompt', sans-serif; font-size: 24px; font-weight: 500;
    color: var(--text); cursor: pointer; transition: all 0.15s ease;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow); user-select: none;
  }
  .pin-key:active { background: var(--red); color: white; border-color: var(--red); transform: scale(0.94); box-shadow: none; }
  .pin-key.delete { background: var(--soft); border-color: var(--border); font-size: 20px; color: var(--text-secondary); box-shadow: none; }
  .pin-key.empty { background: transparent; border-color: transparent; box-shadow: none; pointer-events: none; }

  .pin-error { font-size: 13px; color: var(--danger); font-weight: 400; min-height: 20px; text-align: center; margin-top: 4px; }

  .loading-overlay {
    position: fixed; inset: 0;
    background: rgba(255,255,255,0.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s; gap: 14px;
  }
  .loading-overlay.show { opacity: 1; pointer-events: all; }

  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text { font-size: 14px; color: var(--text-secondary); font-weight: 300; }

  .welcome-overlay {
    position: fixed; inset: 0; background: var(--red);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; gap: 8px;
  }
  .welcome-overlay.show { opacity: 1; pointer-events: all; }
  .welcome-icon { font-size: 48px; margin-bottom: 8px; }
  .welcome-name { font-size: 28px; font-weight: 600; color: white; }
  .welcome-role { font-size: 14px; color: rgba(255,255,255,0.75); font-weight: 300; }

  .version-tag { text-align: center; font-size: 11px; color: var(--text-secondary); font-weight: 300; padding-bottom: 20px; opacity: 0.5; }
</style>
</head>
<body>

<div class="pin-header">
  <div class="logo-easy">EASY</div>
  <div class="logo-sub">หมี่ไก่ฉีก</div>
  <div class="pin-header-desc">ระบบจัดการร้าน</div>
</div>

<div class="pin-body">
  <div class="pin-label">กรอก PIN เพื่อเข้าสู่ระบบ</div>
  <div class="pin-dots" id="pin-dots">
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
  </div>
  <div class="pin-keypad">
    <button class="pin-key" onclick="pinPress('1')">1</button>
    <button class="pin-key" onclick="pinPress('2')">2</button>
    <button class="pin-key" onclick="pinPress('3')">3</button>
    <button class="pin-key" onclick="pinPress('4')">4</button>
    <button class="pin-key" onclick="pinPress('5')">5</button>
    <button class="pin-key" onclick="pinPress('6')">6</button>
    <button class="pin-key" onclick="pinPress('7')">7</button>
    <button class="pin-key" onclick="pinPress('8')">8</button>
    <button class="pin-key" onclick="pinPress('9')">9</button>
    <button class="pin-key empty"></button>
    <button class="pin-key" onclick="pinPress('0')">0</button>
    <button class="pin-key delete" onclick="pinDelete()">⌫</button>
  </div>
  <div class="pin-error" id="pin-error"></div>
</div>

<div class="version-tag">EASY Firebase SIMPLE · ข้อมูลทดสอบเท่านั้น</div>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div class="loading-text">กำลังตรวจสอบ...</div>
</div>

<div class="welcome-overlay" id="welcome">
  <div class="welcome-icon" id="welcome-icon">👋</div>
  <div class="welcome-name" id="welcome-name">—</div>
  <div class="welcome-role" id="welcome-role">—</div>
</div>

<script src="/firebase-client.js"></script>
<script>

let pinBuffer = '';

window.addEventListener('load', async () => {
  if (!sessionStorage.getItem('easy_firebase_token')) return;
  try { const staff = await easyApi('me'); redirectByRole(staff.role); }
  catch { sessionStorage.removeItem('easy_firebase_token'); }
});

function pinPress(digit) {
  if (pinBuffer.length >= 4) return;
  document.getElementById('pin-error').textContent = '';
  pinBuffer += digit;
  updateDots();
  if (pinBuffer.length === 4) setTimeout(verifyPin, 150);
}

function pinDelete() {
  pinBuffer = pinBuffer.slice(0, -1);
  updateDots();
  document.getElementById('pin-error').textContent = '';
}

function updateDots() {
  document.querySelectorAll('.pin-dot').forEach((d, i) => {
    d.classList.toggle('filled', i < pinBuffer.length);
    d.classList.remove('error');
  });
}

async function verifyPin() {
  if (pinBuffer.length !== 4) return;
  showLoading(true);
  try {
    const data = await easyApi('login', {pin: pinBuffer});
    sessionStorage.setItem('easy_firebase_token', data.token);
    showWelcome(data.staff);
  } catch (error) {
    pinBuffer = '';
    document.getElementById('pin-error').textContent = error.message || 'เชื่อมต่อไม่ได้ กรุณาลองใหม่';
    updateDots();
  }
  showLoading(false);
}

function showWelcome(staff) {
  const role = staff.role || 'staff';
  document.getElementById('welcome-icon').textContent = role === 'admin' ? '👑' : '👋';
  document.getElementById('welcome-name').textContent = `สวัสดี คุณ${staff.nickname || staff.name}`;
  document.getElementById('welcome-role').textContent = role === 'admin' ? 'เจ้าของร้าน / Admin' : 'พนักงาน';
  document.getElementById('welcome').classList.add('show');
  setTimeout(() => redirectByRole(role, staff), 1200);
}

function redirectByRole(role) {
  window.location.href = role === 'admin' ? '/dashboard.html' : role === 'driver' ? '/driver.html' : '/clock.html';
}

function showLoading(s) { document.getElementById('loading').classList.toggle('show', s); }
</script>
</body>
</html>
