<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EASY — บันทึกเวลา</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #E5232B;
    --red-dark: #C81D24;
    --yellow: #FFC928;
    --bg: #F5F7FB;
    --white: #FFFFFF;
    --soft: #F9FAFB;
    --border: #E5E7EB;
    --text: #1F2937;
    --text-secondary: #6B7280;
    --green: #22C55E;
    --green-dark: #16A34A;
    --danger: #FF5A4F;
    --blue: #3B82F6;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Prompt', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .app-header {
    background: var(--red);
    padding: 48px 20px 24px;
    border-radius: 0 0 28px 28px;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 6px;
  }

  .header-logo { font-size: 22px; font-weight: 700; color: var(--yellow); }

  .logout-btn {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    font-family: 'Prompt', sans-serif;
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
  }

  .logout-btn:active { background: rgba(255,255,255,0.35); }

  .header-greeting { font-size: 20px; font-weight: 600; color: white; margin-bottom: 2px; }
  .header-branch { font-size: 13px; color: rgba(255,255,255,0.75); font-weight: 300; }

  .app-body { padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; }

  .card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }

  .gps-card { display: flex; align-items: center; gap: 14px; }

  .gps-indicator {
    width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }

  .gps-indicator.checking { background: #FEF3C7; animation: pulse 1.5s infinite; }
  .gps-indicator.ok { background: #DCFCE7; }
  .gps-indicator.error { background: #FEE2E2; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  .gps-info { flex: 1; min-width: 0; }
  .gps-title { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
  .gps-detail { font-size: 12px; color: var(--text-secondary); font-weight: 300; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .gps-badge { font-size: 11px; font-weight: 500; padding: 4px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
  .gps-badge.ok { background: #DCFCE7; color: #16A34A; }
  .gps-badge.error { background: #FEE2E2; color: #DC2626; }
  .gps-badge.checking { background: #FEF3C7; color: #D97706; }

  .clock-card { text-align: center; padding: 20px 16px; }
  .clock-label { font-size: 11px; color: var(--text-secondary); font-weight: 300; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .clock-time { font-size: 52px; font-weight: 700; color: var(--text); letter-spacing: -2px; line-height: 1; margin-bottom: 4px; }
  .clock-date { font-size: 13px; color: var(--text-secondary); font-weight: 300; }

  .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .action-btn {
    border: none; border-radius: var(--radius); padding: 18px 12px;
    font-family: 'Prompt', sans-serif; cursor: pointer; transition: all 0.2s;
    display: flex; flex-direction: column; align-items: center; gap: 4px; user-select: none;
  }

  .action-btn:active { transform: scale(0.97); }
  .action-btn-label { font-size: 12px; font-weight: 400; opacity: 0.85; }
  .action-btn-main { font-size: 20px; font-weight: 700; }

  .btn-checkin { background: var(--green); color: white; box-shadow: 0 4px 16px rgba(34,197,94,0.35); }
  .btn-checkin:active { background: var(--green-dark); }
  .btn-checkin:disabled { background: #D1FAE5; color: #6EE7B7; box-shadow: none; cursor: not-allowed; }

  .btn-checkout { background: var(--red); color: white; box-shadow: 0 4px 16px rgba(229,35,43,0.3); }
  .btn-checkout:active { background: var(--red-dark); }
  .btn-checkout:disabled { background: #FEE2E2; color: #FCA5A5; box-shadow: none; cursor: not-allowed; }

  .today-title { font-size: 12px; color: var(--text-secondary); font-weight: 400; margin-bottom: 10px; }
  .today-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .today-row:last-child { border-bottom: none; }
  .today-row-label { font-size: 13px; color: var(--text-secondary); font-weight: 300; }
  .today-row-value { font-size: 14px; font-weight: 500; color: var(--text); }
  .today-row-value.late { color: var(--danger); }
  .today-row-value.ot { color: var(--blue); }
  .today-row-value.pending { color: #D97706; }

  .history-title { font-size: 12px; color: var(--text-secondary); font-weight: 400; margin-bottom: 10px; }
  .history-item { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .history-item:last-child { border-bottom: none; }
  .history-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .history-dot.in { background: var(--green); }
  .history-dot.out { background: var(--red); }
  .history-action { flex: 1; font-size: 13px; color: var(--text); }
  .history-time { font-size: 12px; color: var(--text-secondary); font-weight: 300; }
  .history-empty { text-align: center; font-size: 13px; color: var(--text-secondary); font-weight: 300; padding: 10px 0; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: flex-end; z-index: 100;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .modal-overlay.visible { opacity: 1; pointer-events: all; }

  .modal-sheet {
    background: var(--white); border-radius: 24px 24px 0 0;
    padding: 24px 20px 40px; width: 100%;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .modal-overlay.visible .modal-sheet { transform: translateY(0); }

  .modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 20px; }
  .modal-icon { font-size: 36px; text-align: center; margin-bottom: 8px; }
  .modal-title { font-size: 18px; font-weight: 600; color: var(--text); text-align: center; margin-bottom: 6px; }
  .modal-desc { font-size: 13px; color: var(--text-secondary); text-align: center; font-weight: 300; line-height: 1.7; margin-bottom: 20px; }
  .modal-highlight { color: var(--text); font-weight: 500; }

  .modal-textarea {
    width: 100%; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    padding: 12px 14px; font-family: 'Prompt', sans-serif; font-size: 14px;
    font-weight: 300; color: var(--text); resize: none; outline: none;
    background: var(--soft); margin-bottom: 16px; transition: border-color 0.2s;
  }
  .modal-textarea:focus { border-color: var(--red); }
  .modal-textarea::placeholder { color: var(--text-secondary); }

  .modal-btn-row { display: flex; gap: 10px; }
  .modal-btn {
    flex: 1; border: none; border-radius: var(--radius-sm); padding: 14px;
    font-family: 'Prompt', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.2s;
  }
  .modal-btn:active { transform: scale(0.97); }
  .modal-btn.primary { background: var(--red); color: white; }
  .modal-btn.secondary { background: var(--soft); color: var(--text-secondary); border: 1.5px solid var(--border); }

  .ot-choice-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .ot-choice { border: 2px solid var(--border); border-radius: var(--radius-sm); padding: 14px 10px; text-align: center; cursor: pointer; transition: all 0.2s; background: var(--soft); }
  .ot-choice.selected { border-color: var(--blue); background: #EFF6FF; }
  .ot-choice-icon { font-size: 22px; margin-bottom: 4px; }
  .ot-choice-label { font-size: 13px; font-weight: 500; color: var(--text); }

  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--text); color: white; font-size: 13px;
    padding: 12px 20px; border-radius: 24px; z-index: 200;
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    white-space: nowrap; max-width: 90vw; text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { background: var(--green-dark); }
  .toast.error { background: var(--danger); }

  .loading-overlay {
    position: fixed; inset: 0; background: rgba(255,255,255,0.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 150; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .loading-overlay.show { opacity: 1; pointer-events: all; }

  .spinner {
    width: 36px; height: 36px; border: 3px solid var(--border);
    border-top-color: var(--red); border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="app-header">
  <div class="header-top">
    <div class="header-logo">EASY</div>
    <button class="logout-btn" onclick="logout()">ออกจากระบบ</button>
  </div>
  <div class="header-greeting" id="greeting">สวัสดี —</div>
  <div class="header-branch" id="branch-label">สาขา: —</div>
</div>

<div class="app-body">
  <div class="card gps-card">
    <div class="gps-indicator checking" id="gps-indicator">📡</div>
    <div class="gps-info">
      <div class="gps-title" id="gps-title">กำลังตรวจสอบตำแหน่ง</div>
      <div class="gps-detail" id="gps-detail">รอสักครู่...</div>
    </div>
    <div class="gps-badge checking" id="gps-badge">รอ GPS</div>
  </div>

  <div class="card clock-card">
    <div class="clock-label">เวลาปัจจุบัน</div>
    <div class="clock-time" id="clock-time">--:--:--</div>
    <div class="clock-date" id="clock-date">—</div>
  </div>

  <div class="action-row">
    <button class="action-btn btn-checkin" id="btn-checkin" onclick="handleCheckIn()" disabled>
      <span class="action-btn-label">บันทึก</span>
      <span class="action-btn-main">เข้างาน</span>
    </button>
    <button class="action-btn btn-checkout" id="btn-checkout" onclick="handleCheckOut()" disabled>
      <span class="action-btn-label">บันทึก</span>
      <span class="action-btn-main">ออกงาน</span>
    </button>
  </div>

  <div class="card" id="today-card" style="display:none">
    <div class="today-title">📋 สถานะวันนี้</div>
    <div id="today-rows"></div>
  </div>

  <div class="card">
    <div class="history-title">🕐 ประวัติล่าสุด</div>
    <div id="history-list"><div class="history-empty">กำลังโหลด...</div></div>
  </div>
</div>

<!-- MODAL สาย -->
<div class="modal-overlay" id="modal-late">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-icon">⏰</div>
    <div class="modal-title">คุณเข้างานสาย</div>
    <div class="modal-desc">
      เวลาเริ่มงาน <span class="modal-highlight" id="late-shift-time">—</span><br>
      คุณมาถึงเวลา <span class="modal-highlight" id="late-actual-time">—</span><br>
      สาย <span class="modal-highlight" id="late-minutes" style="color:var(--danger)">—</span>
    </div>
    <textarea class="modal-textarea" id="late-reason-input" rows="3" placeholder="ระบุเหตุผลสั้นๆ เช่น รถติด, ไม่สบาย..."></textarea>
    <div class="modal-btn-row">
      <button class="modal-btn primary" style="flex:1" onclick="submitLateReason()">บันทึกเข้างาน</button>
    </div>
  </div>
</div>

<!-- MODAL OT -->
<div class="modal-overlay" id="modal-ot">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-icon">💼</div>
    <div class="modal-title">มีสิทธิ์ได้รับ OT</div>
    <div class="modal-desc">
      เวลาเลิกงาน <span class="modal-highlight" id="ot-shift-end">—</span><br>
      คุณบันทึกเวลา <span class="modal-highlight" id="ot-actual-time">—</span><br>
      OT <span class="modal-highlight" id="ot-minutes" style="color:var(--blue)">—</span><br>
      ต้องการขอ OT หรือไม่?
    </div>
    <div class="ot-choice-row">
      <div class="ot-choice" id="ot-yes" onclick="selectOT('yes')">
        <div class="ot-choice-icon">✅</div>
        <div class="ot-choice-label">ขอ OT</div>
      </div>
      <div class="ot-choice" id="ot-no" onclick="selectOT('no')">
        <div class="ot-choice-icon">❌</div>
        <div class="ot-choice-label">ไม่ขอ</div>
      </div>
    </div>
    <div id="ot-reason-wrapper" style="display:none">
      <textarea class="modal-textarea" id="ot-reason-input" rows="3" placeholder="ระบุเหตุผล OT เช่น งานยังไม่เสร็จ..."></textarea>
    </div>
    <div class="modal-btn-row">
      <button class="modal-btn secondary" id="ot-cancel-btn" onclick="submitOT(false)">ยืนยัน</button>
      <button class="modal-btn primary" id="ot-confirm-btn" onclick="submitOT(true)" style="display:none">ยืนยันขอ OT</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="loading-overlay" id="loading"><div class="spinner"></div></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxxTjC7xOGHlgyStVBf6SimoU5RA7xX3VPwxIUtfGlpMNO89OQPDaRewKDDEmWGK4kk/exec';
const SESSION_KEY = 'easy_session';

const THAI_DAYS = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const THAI_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

let currentStaff = null;
let currentPosition = null;
let gpsOk = false;
let settings = {};
let todayRecord = null;
let otChoice = null;

window.addEventListener('load', async () => {
  const session = loadSession();
  if (!session) { window.location.href = '/index.html'; return; }
  if (session.role === 'admin') { window.location.href = '/payroll.html'; return; }

  currentStaff = session.staff;
  document.getElementById('greeting').textContent = `สวัสดี คุณ${currentStaff.nickname || currentStaff.name}`;
  document.getElementById('branch-label').textContent = `สาขา: ${currentStaff.branch_id || '—'}`;

  startClock();
  await loadSettings();
  startGPS();
  await loadTodayStatus();
  await loadHistory();
});

function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (Date.now() > data.expires) { localStorage.removeItem(SESSION_KEY); return null; }
    return data;
  } catch { return null; }
}

function logout() {
  localStorage.removeItem(SESSION_KEY);
  window.location.href = '/index.html';
}

function startClock() {
  function tick() {
    const now = new Date();
    document.getElementById('clock-time').textContent =
      `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
    document.getElementById('clock-date').textContent =
      `วัน${THAI_DAYS[now.getDay()]}ที่ ${now.getDate()} ${THAI_MONTHS[now.getMonth()]} ${now.getFullYear()+543}`;
  }
  tick();
  setInterval(tick, 1000);
}

async function loadSettings() {
  try { const r = await apiGet('action=getSettings'); if (r.success) settings = r.data; } catch {}
}

function startGPS() {
  if (!navigator.geolocation) {
    setGPS('error','❌','GPS ไม่รองรับ','อุปกรณ์ไม่รองรับ GPS','ไม่รองรับ'); return;
  }
  navigator.geolocation.watchPosition(
    pos => { currentPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude }; checkNearBranch(); },
    () => { setGPS('error','❌','ไม่สามารถรับ GPS','กรุณาเปิดอนุญาต Location','ไม่มี GPS'); gpsOk = false; updateButtons(); },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 }
  );
}

async function checkNearBranch() {
  try {
    const res = await apiGet('action=getBranches');
    if (!res.success || !currentPosition) return;
    let nearBranch = null, minDist = Infinity;
    res.data.forEach(b => {
      if (!b.lat || !b.lng) return;
      const d = haversine(currentPosition.lat, currentPosition.lng, parseFloat(b.lat), parseFloat(b.lng));
      if (d <= parseFloat(b.allowed_radius_m) && d < minDist) { minDist = d; nearBranch = b; }
    });
    if (nearBranch) {
      gpsOk = true;
      setGPS('ok','✅',`ใกล้: ${nearBranch.name}`,`ระยะห่าง ${Math.round(minDist)} เมตร`,'เช็คอินได้');
      document.getElementById('branch-label').textContent = `สาขา: ${nearBranch.name}`;
    } else {
      gpsOk = false;
      setGPS('error','📍','อยู่นอกพื้นที่','ไม่พบสาขาในรัศมี','นอกพื้นที่');
    }
    updateButtons();
  } catch {}
}

function setGPS(state, icon, title, detail, badge) {
  document.getElementById('gps-indicator').className = `gps-indicator ${state}`;
  document.getElementById('gps-indicator').textContent = icon;
  document.getElementById('gps-title').textContent = title;
  document.getElementById('gps-detail').textContent = detail;
  document.getElementById('gps-badge').className = `gps-badge ${state}`;
  document.getElementById('gps-badge').textContent = badge;
}

function updateButtons() {
  const hasIn = todayRecord && todayRecord.clock_in && !todayRecord.clock_out;
  const done = todayRecord && todayRecord.clock_in && todayRecord.clock_out;
  document.getElementById('btn-checkin').disabled = !gpsOk || hasIn || done;
  document.getElementById('btn-checkout').disabled = !gpsOk || !hasIn;
}

async function loadTodayStatus() {
  try {
    const res = await apiGet('action=getTodayStatus');
    if (res.success && currentStaff) {
      todayRecord = res.data.find(r => r.staff_id === currentStaff.staff_id) || null;
      renderToday(); updateButtons();
    }
  } catch {}
}

function renderToday() {
  const card = document.getElementById('today-card');
  if (!todayRecord) { card.style.display = 'none'; return; }
  card.style.display = 'block';
  let html = '';
  if (todayRecord.clock_in) html += row('เข้างาน', todayRecord.clock_in);
  if (todayRecord.late_min > 0) html += row('สาย', `${todayRecord.late_min} นาที${todayRecord.late_min < 16 ? ' (ไม่หัก)' : ''}`, todayRecord.late_min >= 16 ? 'late' : '');
  if (todayRecord.clock_out) html += row('ออกงาน', todayRecord.clock_out);
  if (todayRecord.hours_worked) html += row('ชั่วโมงทำงาน', `${parseFloat(todayRecord.hours_worked).toFixed(1)} ชม.`);
  if (parseFloat(todayRecord.ot_hours) > 0) html += row(todayRecord.ot_status === 'pending' ? 'OT (รออนุมัติ)' : 'OT', `${(parseFloat(todayRecord.ot_hours)*60).toFixed(0)} นาที`, todayRecord.ot_status === 'pending' ? 'pending' : 'ot');
  document.getElementById('today-rows').innerHTML = html;
}

function row(label, value, cls = '') {
  return `<div class="today-row"><span class="today-row-label">${label}</span><span class="today-row-value ${cls}">${value}</span></div>`;
}

async function loadHistory() {
  const list = document.getElementById('history-list');
  try {
    const from = new Date(Date.now() - 7*24*60*60*1000);
    const dateFrom = `${from.getFullYear()}-${String(from.getMonth()+1).padStart(2,'0')}-${String(from.getDate()).padStart(2,'0')}`;
    const res = await apiGet(`action=getTimesheets&staff_id=${currentStaff.staff_id}&date_from=${dateFrom}`);
    if (!res.success || !res.data.length) { list.innerHTML = '<div class="history-empty">ยังไม่มีประวัติ</div>'; return; }
    const items = [];
    res.data.slice(-5).reverse().forEach(r => {
      if (r.clock_out) items.push({ type: 'out', text: 'ออกงาน', time: `${r.date} · ${r.clock_out}` });
      if (r.clock_in) items.push({ type: 'in', text: 'เข้างาน', time: `${r.date} · ${r.clock_in}` });
    });
    list.innerHTML = items.slice(0,4).map(it => `
      <div class="history-item">
        <div class="history-dot ${it.type}"></div>
        <div class="history-action">${it.text}</div>
        <div class="history-time">${it.time}</div>
      </div>`).join('') || '<div class="history-empty">ยังไม่มีประวัติ</div>';
  } catch { list.innerHTML = '<div class="history-empty">โหลดไม่สำเร็จ</div>'; }
}

async function handleCheckIn() {
  if (!gpsOk || !currentPosition) { showToast('GPS ยังไม่พร้อม', 'error'); return; }
  const now = new Date();
  const shift = currentStaff.shift === 'night' ? settings.shift_night_start : settings.shift_morning_start;
  const lateMin = calcLateMin(shift, now);
  if (lateMin >= 11) {
    document.getElementById('late-shift-time').textContent = shift;
    document.getElementById('late-actual-time').textContent = getTimeStr(now);
    document.getElementById('late-minutes').textContent = `${lateMin} นาที`;
    document.getElementById('late-reason-input').value = '';
    showModal('modal-late');
  } else { await doClockIn(''); }
}

async function submitLateReason() {
  const reason = document.getElementById('late-reason-input').value.trim();
  if (!reason) { showToast('กรุณาระบุเหตุผล', 'error'); return; }
  hideModal('modal-late');
  await doClockIn(reason);
}

async function doClockIn(lateReason) {
  showLoading(true);
  try {
    const res = await apiPost({ action: 'clockIn', staff_id: currentStaff.staff_id, lat: currentPosition.lat, lng: currentPosition.lng, date: getDateStr(), late_reason: lateReason });
    if (res.success) { showToast(`✅ บันทึกเข้างาน ${res.clock_in}`, 'success'); await loadTodayStatus(); await loadHistory(); }
    else showToast(res.message || 'เกิดข้อผิดพลาด', 'error');
  } catch { showToast('เชื่อมต่อไม่ได้', 'error'); }
  showLoading(false);
}

async function handleCheckOut() {
  if (!gpsOk || !currentPosition) { showToast('GPS ยังไม่พร้อม', 'error'); return; }
  const now = new Date();
  const shift = currentStaff.shift === 'night' ? settings.shift_night_end : settings.shift_morning_end;
  const otMin = calcOTMin(shift, now);
  const grace = parseInt(settings.ot_grace_min) || 15;
  if (otMin >= grace + 1) {
    document.getElementById('ot-shift-end').textContent = shift;
    document.getElementById('ot-actual-time').textContent = getTimeStr(now);
    document.getElementById('ot-minutes').textContent = `${otMin} นาที`;
    otChoice = null;
    document.getElementById('ot-yes').classList.remove('selected');
    document.getElementById('ot-no').classList.remove('selected');
    document.getElementById('ot-reason-wrapper').style.display = 'none';
    document.getElementById('ot-confirm-btn').style.display = 'none';
    document.getElementById('ot-cancel-btn').textContent = 'ยืนยัน';
    document.getElementById('ot-reason-input').value = '';
    showModal('modal-ot');
  } else { await doClockOut('no', ''); }
}

function selectOT(choice) {
  otChoice = choice;
  document.getElementById('ot-yes').classList.toggle('selected', choice === 'yes');
  document.getElementById('ot-no').classList.toggle('selected', choice === 'no');
  document.getElementById('ot-reason-wrapper').style.display = choice === 'yes' ? 'block' : 'none';
  document.getElementById('ot-confirm-btn').style.display = choice === 'yes' ? 'block' : 'none';
  document.getElementById('ot-cancel-btn').textContent = choice === 'no' ? 'ยืนยัน ไม่ขอ OT' : 'ยกเลิก';
}

async function submitOT(withOT) {
  if (withOT) {
    const reason = document.getElementById('ot-reason-input').value.trim();
    if (!reason) { showToast('กรุณาระบุเหตุผล OT', 'error'); return; }
    hideModal('modal-ot'); await doClockOut('yes', reason);
  } else {
    if (!otChoice) { showToast('กรุณาเลือกก่อน', 'error'); return; }
    hideModal('modal-ot'); await doClockOut('no', '');
  }
}

async function doClockOut(otRequested, otReason) {
  showLoading(true);
  try {
    const res = await apiPost({ action: 'clockOut', staff_id: currentStaff.staff_id, lat: currentPosition.lat, lng: currentPosition.lng, date: getDateStr(), ot_requested: otRequested, ot_reason: otReason });
    if (res.success) { showToast(otRequested === 'yes' ? `✅ ออกงาน ${res.clock_out} — ส่งคำขอ OT แล้ว` : `✅ บันทึกออกงาน ${res.clock_out}`, 'success'); await loadTodayStatus(); await loadHistory(); }
    else showToast(res.message || 'เกิดข้อผิดพลาด', 'error');
  } catch { showToast('เชื่อมต่อไม่ได้', 'error'); }
  showLoading(false);
}

function calcLateMin(s, now) { const [sh,sm]=s.split(':').map(Number); return Math.max(0,(now.getHours()*60+now.getMinutes())-(sh*60+sm)); }
function calcOTMin(s, now) { const [eh,em]=s.split(':').map(Number); let n=now.getHours()*60+now.getMinutes(),e=eh*60+em; if(n<e-300)n+=1440; return Math.max(0,n-e); }
function haversine(a,b,c,d){const R=6371000,dL=(c-a)*Math.PI/180,dN=(d-b)*Math.PI/180,x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dN/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function getTimeStr(d=new Date()){return`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
function getDateStr(d=new Date()){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
async function apiGet(p){const r=await fetch(`${API_URL}?${p}`);return r.json();}
async function apiPost(b){const r=await fetch(API_URL,{method:'POST',body:JSON.stringify(b)});return r.json();}
function showModal(id){document.getElementById(id).classList.add('visible');}
function hideModal(id){document.getElementById(id).classList.remove('visible');}
function showLoading(s){document.getElementById('loading').classList.toggle('show',s);}
function showToast(msg,type=''){const t=document.getElementById('toast');t.textContent=msg;t.className=`toast ${type} show`;setTimeout(()=>t.classList.remove('show'),3500);}
</script>
