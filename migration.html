<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EASY — ย้ายข้อมูลครั้งแรก</title><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet"><style>body{font-family:Prompt,sans-serif;background:#f5f7fb;color:#1f2937;max-width:600px;margin:48px auto;padding:0 20px}.box{background:#fff;border-radius:18px;padding:26px;box-shadow:0 2px 15px #0001}input,button{font:inherit;padding:12px;width:100%;box-sizing:border-box;margin:7px 0;border-radius:10px;border:1px solid #ddd}button{background:#e5232b;color:#fff;border:0;font-weight:600;cursor:pointer}#import{display:none}pre{white-space:pre-wrap;background:#fff;padding:15px;border-radius:12px;font-size:12px}</style></head><body><h1>EASY · ย้ายข้อมูลครั้งแรก</h1><div class="box" id="login"><p>หน้านี้ใช้ครั้งเดียวสำหรับแอดมินเท่านั้น</p><input id="id" value="PC001" placeholder="รหัสพนักงาน"><input id="pin" type="password" placeholder="PIN"><button onclick="login()">เข้าสู่ระบบแอดมิน</button></div><div class="box" id="import"><p>เลือกไฟล์ Excel เดิม แล้วระบบจะย้ายข้อมูลเข้า Firebase และสร้างบัญชีพนักงานที่ active โดยใช้รหัสเดิม</p><input id="file" type="file" accept=".xlsx"><button onclick="importFile()">เริ่มย้ายข้อมูล</button></div><pre id="log">รอเข้าสู่ระบบ…</pre><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="/firebase-config.js"></script><script src="/firebase-api.js"></script><script>
const log=t=>document.getElementById('log').textContent=t;
async function login(){try{const id=document.getElementById('id').value.trim().toUpperCase(),pin=document.getElementById('pin').value;await easyApi.auth.signInWithEmailAndPassword(`${id.toLowerCase()}@easy-backoffice.local`,`EASY-${pin}`);if(!easyApi.isAdmin())throw Error('บัญชีนี้ไม่ใช่แอดมิน');document.getElementById('login').style.display='none';document.getElementById('import').style.display='block';log('พร้อมย้ายข้อมูล');}catch(e){log('เข้าไม่ได้: '+e.message)}}
const ids={staff:'staff_id',branches:'branch_id',timesheets:'record_id',payroll_runs:'run_id',advances:'advance_id',stock_logs:'log_id',settings:'key',central_targets:'item_name',driver_jobs:'created_at',pending_purchases:'date',inventory:'item_id',purchase_minimums:'item_name'};
const privateKeys=new Set(['rate','ot_rate','bank_name','bank_account','national_id','pay_cycle','late_threshold_min']);
async function importFile(){const file=document.getElementById('file').files[0];if(!file)return log('กรุณาเลือกไฟล์ Excel ก่อน');try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:false});let n=0;for(const name of wb.SheetNames){if(!ids[name])continue;const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:'',raw:false});for(const row of rows){const key=String(row[ids[name]]||`${name}-${n}`);if(!Object.values(row).some(v=>v!==''))continue;if(name==='staff'){const pub={};const pri={staff_id:row.staff_id};for(const[k,v]of Object.entries(row)){if(k==='pin')continue;(privateKeys.has(k)?pri:pub)[k]=v}pub.email=`${String(row.staff_id).toLowerCase()}@easy-backoffice.local`;await easyApi.db.collection('staff').doc(String(row.staff_id)).set(pub);await easyApi.db.collection('staff_private').doc(String(row.staff_id)).set(pri);if(row.status==='active'&&row.pin){const secondary=firebase.initializeApp(EASY_FIREBASE_CONFIG,`create-${row.staff_id}`);try{await secondary.auth().createUserWithEmailAndPassword(pub.email,`EASY-${String(row.pin).padStart(4,'0')}`)}catch(e){if(e.code!=='auth/email-already-in-use')throw e}await secondary.auth().signOut();await secondary.delete()}}else await easyApi.db.collection(name).doc(key.replaceAll('/','_')).set(row);n++;if(n%25===0)log(`กำลังย้าย ${n} รายการ…`)}}log(`สำเร็จ: ย้าย ${n} รายการแล้ว\n\nหลังตรวจสอบแล้ว ให้ลบหน้านี้ออกหรือเปลี่ยนชื่อไฟล์เพื่อไม่ให้ใครเปิดได้`)}catch(e){console.error(e);log('หยุดเพราะ: '+e.message)}}
</script></body></html>
