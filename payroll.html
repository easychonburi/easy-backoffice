<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EASY — Payroll</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #E5232B;
    --red-dark: #C81D24;
    --yellow: #FFC928;
    --bg: #F5F7FB;
    --white: #FFFFFF;
    --soft: #F9FAFB;
    --border: #E5E7EB;
    --text: #1F2937;
    --text-secondary: #6B7280;
    --green: #22C55E;
    --green-dark: #16A34A;
    --green-bg: #DCFCE7;
    --danger: #FF5A4F;
    --danger-bg: #FEE2E2;
    --blue: #3B82F6;
    --blue-bg: #EFF6FF;
    --orange: #F97316;
    --orange-bg: #FFF7ED;
    --purple: #8B5CF6;
    --purple-bg: #EDE9FE;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Prompt', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .app-header {
    background: var(--red);
    padding: 48px 20px 24px;
    border-radius: 0 0 28px 28px;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .header-logo { font-size: 20px; font-weight: 700; color: var(--yellow); }
  .header-title { font-size: 22px; font-weight: 600; color: white; margin-bottom: 2px; }
  .header-sub { font-size: 13px; color: rgba(255,255,255,0.7); font-weight: 300; }

  .header-btns { display: flex; gap: 8px; }

  .logout-btn {
    background: rgba(255,255,255,0.2);
    border: none; color: white;
    font-family: 'Prompt', sans-serif;
    font-size: 12px; padding: 6px 14px;
    border-radius: 20px; cursor: pointer;
  }
  .logout-btn:active { background: rgba(255,255,255,0.35); }

  .app-body { padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; }

  .card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }

  /* OT ALERT */
  .ot-alert {
    background: var(--orange-bg);
    border: 1px solid #FED7AA;
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer; transition: all 0.2s;
  }
  .ot-alert:active { transform: scale(0.99); }
  .ot-alert-icon { font-size: 22px; flex-shrink: 0; }
  .ot-alert-text { flex: 1; }
  .ot-alert-title { font-size: 14px; font-weight: 500; color: var(--orange); }
  .ot-alert-sub { font-size: 12px; color: var(--text-secondary); font-weight: 300; }
  .ot-alert-arrow { font-size: 16px; color: var(--orange); flex-shrink: 0; }

  /* GROUP CARD */
  .group-label {
    font-size: 11px; color: var(--text-secondary);
    font-weight: 400; text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 10px;
  }
  .group-period-row {
    display: flex; justify-content: space-between;
    align-items: flex-start; margin-bottom: 12px;
  }
  .group-period-title { font-size: 13px; color: var(--text-secondary); font-weight: 300; margin-bottom: 2px; }
  .group-period-value { font-size: 15px; font-weight: 500; color: var(--text); }
  .group-pay-label { font-size: 11px; color: var(--text-secondary); font-weight: 300; margin-bottom: 2px; text-align: right; }
  .group-pay-value { font-size: 14px; font-weight: 600; text-align: right; }
  .group-pay-value.payday { color: var(--red); }
  .group-pay-value.normal { color: var(--text); }
  .group-bottom {
    display: flex; justify-content: space-between;
    align-items: center; padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .group-amount { font-size: 22px; font-weight: 700; color: var(--text); }
  .group-count { font-size: 11px; color: var(--text-secondary); font-weight: 300; margin-top: 1px; }
  .group-btn {
    border: none; border-radius: var(--radius-sm);
    padding: 10px 18px;
    font-family: 'Prompt', sans-serif;
    font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.2s;
  }
  .group-btn:active { transform: scale(0.97); }
  .group-btn.payday { background: var(--red); color: white; }
  .group-btn.normal { background: var(--soft); color: var(--text-secondary); border: 1.5px solid var(--border); }

  /* LIST PAGE */
  #staff-list-page { display: none; }

  .list-header {
    background: var(--red);
    padding: 48px 20px 24px;
    border-radius: 0 0 28px 28px;
  }

  .back-btn-inline {
    background: rgba(255,255,255,0.2);
    border: none; color: white;
    font-family: 'Prompt', sans-serif;
    font-size: 13px; padding: 6px 12px;
    border-radius: 20px; cursor: pointer;
    margin-bottom: 8px; display: inline-block;
  }

  /* STAFF CARD */
  .staff-card {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    overflow: hidden; cursor: pointer; transition: all 0.2s;
  }
  .staff-card:active { transform: scale(0.99); }
  .staff-card.is-paid { opacity: 0.65; }

  .staff-card-top {
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
  }

  .staff-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--red); color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; flex-shrink: 0;
  }
  .staff-avatar.paid { background: var(--green-dark); }

  .staff-info { flex: 1; min-width: 0; }
  .staff-name { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
  .staff-meta { font-size: 11px; color: var(--text-secondary); font-weight: 300; }

  .staff-right { text-align: right; flex-shrink: 0; }
  .staff-amount { font-size: 18px; font-weight: 700; color: var(--text); }
  .staff-amount-label { font-size: 10px; color: var(--text-secondary); font-weight: 300; }

  .staff-card-bottom {
    padding: 8px 16px;
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }

  .staff-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 11px; font-weight: 400; padding: 3px 8px; border-radius: 10px; }
  .chip-late { background: var(--danger-bg); color: var(--danger); }
  .chip-ot { background: var(--orange-bg); color: var(--orange); }
  .chip-ot-pending { background: var(--orange-bg); color: var(--orange); }
  .chip-ok { background: var(--green-bg); color: var(--green-dark); }
  .chip-advance { background: var(--purple-bg); color: var(--purple); }

  .staff-status {
    font-size: 11px; font-weight: 500;
    padding: 3px 10px; border-radius: 20px; flex-shrink: 0;
  }
  .status-ready { background: var(--blue-bg); color: var(--blue); }
  .status-paid { background: var(--green-bg); color: var(--green-dark); }
  .status-missing { background: var(--danger-bg); color: var(--danger); }

  /* DETAIL SHEET */
  .detail-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .detail-overlay.visible { opacity: 1; pointer-events: all; }

  .detail-sheet {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: var(--white); border-radius: 24px 24px 0 0;
    max-height: 92vh; overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .detail-overlay.visible .detail-sheet { transform: translateY(0); }

  .sheet-handle {
    width: 36px; height: 4px;
    background: var(--border); border-radius: 2px;
    margin: 16px auto 0;
  }

  .sheet-header {
    padding: 16px 20px 14px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }

  .sheet-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--red); color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 600; flex-shrink: 0;
  }

  .sheet-name { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .sheet-meta { font-size: 12px; color: var(--text-secondary); font-weight: 300; }

  .sheet-body { padding: 16px 20px 32px; }

  /* TOTAL BOX */
  .total-box {
    background: var(--red); border-radius: var(--radius);
    padding: 18px 20px; margin-bottom: 14px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .total-box-label { font-size: 12px; color: rgba(255,255,255,0.75); font-weight: 300; margin-bottom: 4px; }
  .total-box-amount { font-size: 30px; font-weight: 700; color: white; line-height: 1; }
  .total-box-period { font-size: 11px; color: rgba(255,255,255,0.6); font-weight: 300; margin-top: 4px; }
  .total-box-right { text-align: right; }
  .total-box-pay-label { font-size: 11px; color: rgba(255,255,255,0.7); font-weight: 300; margin-bottom: 3px; }
  .total-box-pay-date { font-size: 14px; font-weight: 500; color: white; }

  /* PAID BOX */
  .paid-box {
    background: var(--green-bg); border: 1px solid #86EFAC;
    border-radius: var(--radius); padding: 14px 18px;
    margin-bottom: 14px; display: flex; align-items: center; gap: 12px;
  }
  .paid-box-icon { font-size: 24px; }
  .paid-box-title { font-size: 15px; font-weight: 600; color: var(--green-dark); }
  .paid-box-sub { font-size: 12px; color: var(--green-dark); font-weight: 300; opacity: 0.8; }

  /* BANK CARD */
  .bank-card {
    background: var(--blue-bg); border: 1px solid #BFDBFE;
    border-radius: var(--radius-sm); padding: 12px 14px;
    margin-bottom: 14px; display: flex; align-items: center; gap: 12px;
  }
  .bank-icon { font-size: 22px; flex-shrink: 0; }
  .bank-info { flex: 1; }
  .bank-name { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
  .bank-account { font-size: 16px; font-weight: 600; color: var(--blue); letter-spacing: 0.5px; }
  .bank-copy-btn {
    border: none; background: var(--blue); color: white;
    font-family: 'Prompt', sans-serif;
    font-size: 11px; font-weight: 500;
    padding: 6px 12px; border-radius: 8px; cursor: pointer; flex-shrink: 0;
  }

  /* SECTION LABEL */
  .section-label {
    font-size: 11px; color: var(--text-secondary);
    font-weight: 400; text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 8px;
  }

  /* OT PENDING */
  .ot-pending-section {
    background: var(--orange-bg); border: 1px solid #FED7AA;
    border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 14px;
  }
  .ot-pending-title { font-size: 12px; font-weight: 500; color: var(--orange); margin-bottom: 8px; }
  .ot-pending-item {
    background: var(--white); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 10px;
  }
  .ot-pending-item:last-child { margin-bottom: 0; }
  .ot-pending-info { flex: 1; }
  .ot-pending-date { font-size: 13px; font-weight: 500; color: var(--text); }
  .ot-pending-detail { font-size: 11px; color: var(--text-secondary); font-weight: 300; margin-top: 1px; }
  .ot-pending-btns { display: flex; gap: 6px; }
  .ot-btn {
    border: none; border-radius: 8px; padding: 6px 12px;
    font-family: 'Prompt', sans-serif; font-size: 12px; font-weight: 500; cursor: pointer;
  }
  .ot-btn.approve { background: var(--green-bg); color: var(--green-dark); }
  .ot-btn.reject { background: var(--danger-bg); color: var(--danger); }

  /* BREAKDOWN */
  .breakdown-box {
    background: var(--soft); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 14px;
  }
  .breakdown-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 0; border-bottom: 1px solid var(--border);
  }
  .breakdown-row:last-child { border-bottom: none; padding-bottom: 0; }
  .breakdown-label { font-size: 13px; color: var(--text-secondary); font-weight: 300; }
  .breakdown-value { font-size: 14px; font-weight: 500; color: var(--text); }
  .breakdown-value.plus { color: var(--green-dark); }
  .breakdown-value.minus { color: var(--danger); }
  .breakdown-value.advance { color: var(--purple); }
  .breakdown-total { font-size: 16px; font-weight: 700; color: var(--red); }

  /* TIMESHEET */
  .ts-item {
    background: var(--white); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px;
  }
  .ts-item:last-child { margin-bottom: 0; }
  .ts-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
  .ts-date { font-size: 13px; font-weight: 500; color: var(--text); }
  .ts-day-total { font-size: 13px; font-weight: 600; color: var(--blue); }
  .ts-chips { display: flex; gap: 5px; flex-wrap: wrap; }
  .ts-chip { font-size: 11px; padding: 2px 7px; border-radius: 8px; font-weight: 400; }
  .tc-time { background: var(--soft); color: var(--text-secondary); border: 1px solid var(--border); }
  .tc-late { background: var(--danger-bg); color: var(--danger); }
  .tc-ot { background: var(--blue-bg); color: var(--blue); }
  .tc-ok { background: var(--green-bg); color: var(--green-dark); }

  /* ADVANCES LIST IN DETAIL */
  .advance-deduct-item {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--purple-bg); border-radius: 8px;
    padding: 8px 12px; margin-bottom: 6px;
  }
  .advance-deduct-item:last-child { margin-bottom: 0; }
  .advance-deduct-label { font-size: 13px; color: var(--purple); font-weight: 400; }
  .advance-deduct-note { font-size: 11px; color: var(--text-secondary); font-weight: 300; }
  .advance-deduct-amount { font-size: 14px; font-weight: 600; color: var(--purple); }

  /* ADJUST */
  .adjust-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .adjust-input {
    flex: 1; border: 1.5px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 12px;
    font-family: 'Prompt', sans-serif; font-size: 14px; font-weight: 300;
    color: var(--text); background: var(--soft); outline: none;
  }
  .adjust-input:focus { border-color: var(--red); }
  .adjust-unit { font-size: 13px; color: var(--text-secondary); }
  .adjust-note {
    width: 100%; border: 1.5px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 12px;
    font-family: 'Prompt', sans-serif; font-size: 13px; font-weight: 300;
    color: var(--text); background: var(--soft);
    outline: none; resize: none; margin-bottom: 14px;
  }
  .adjust-note:focus { border-color: var(--red); }

  /* SHEET ACTIONS */
  .sheet-actions { display: flex; gap: 10px; }
  .sheet-btn {
    flex: 1; border: none; border-radius: var(--radius-sm); padding: 14px;
    font-family: 'Prompt', sans-serif; font-size: 14px; font-weight: 500;
    cursor: pointer; transition: all 0.2s;
  }
  .sheet-btn:active { transform: scale(0.97); }
  .sheet-btn.close { background: var(--soft); color: var(--text-secondary); border: 1.5px solid var(--border); }
  .sheet-btn.confirm { background: var(--green); color: white; }
  .sheet-btn.confirm:disabled { background: #D1FAE5; color: #6EE7B7; cursor: not-allowed; transform: none; }
  .warn-text { text-align: center; font-size: 11px; color: var(--orange); font-weight: 300; margin-top: 8px; }

  /* EMPTY */
  .empty-state { text-align: center; padding: 32px 20px; }
  .empty-icon { font-size: 32px; margin-bottom: 8px; }
  .empty-text { font-size: 13px; color: var(--text-secondary); font-weight: 300; }

  /* TOAST / LOADING */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--text); color: white; font-size: 13px; padding: 12px 20px;
    border-radius: 24px; z-index: 300;
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    white-space: nowrap; max-width: 90vw; text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { background: var(--green-dark); }
  .toast.error { background: var(--danger); }

  .loading-overlay {
    position: fixed; inset: 0; background: rgba(255,255,255,0.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .loading-overlay.show { opacity: 1; pointer-events: all; }

  .spinner {
    width: 36px; height: 36px; border: 3px solid var(--border);
    border-top-color: var(--red); border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ═══ CALENDAR ═══ */
  .cal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .cal-overlay.visible { opacity: 1; pointer-events: all; }
  .cal-sheet {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: var(--white); border-radius: 24px 24px 0 0;
    max-height: 92vh; overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    padding-bottom: 32px;
  }
  .cal-overlay.visible .cal-sheet { transform: translateY(0); }
  .cal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 16px auto 0; }
  .cal-header {
    padding: 14px 20px; display: flex; align-items: center;
    justify-content: space-between; border-bottom: 1px solid var(--border);
  }
  .cal-title { font-size: 16px; font-weight: 600; color: var(--text); }
  .cal-subtitle { font-size: 12px; color: var(--text-secondary); font-weight: 300; margin-top: 1px; }
  .cal-close-btn {
    background: var(--soft); border: 1px solid var(--border);
    border-radius: 20px; padding: 6px 14px;
    font-family: 'Prompt', sans-serif; font-size: 12px; cursor: pointer; color: var(--text-secondary);
  }
  .cal-legend {
    display: flex; gap: 10px; padding: 10px 16px 4px; flex-wrap: wrap;
  }
  .cal-legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-secondary); font-weight: 300; }
  .cal-legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .cal-nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px 6px;
  }
  .cal-nav-btn {
    background: var(--soft); border: 1px solid var(--border);
    border-radius: 10px; width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; cursor: pointer; color: var(--text);
  }
  .cal-nav-btn:active { background: var(--border); }
  .cal-month-label { font-size: 17px; font-weight: 600; color: var(--text); }
  .cal-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr);
    padding: 0 10px; gap: 3px; margin-bottom: 3px;
  }
  .cal-weekday-label {
    text-align: center; font-size: 11px; font-weight: 500;
    color: var(--text-secondary); padding: 4px 0;
  }
  .cal-weekday-label.sun { color: var(--danger); }
  .cal-weekday-label.sat { color: var(--blue); }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    padding: 0 10px; gap: 3px;
  }
  .cal-cell {
    border-radius: 8px; min-height: 66px; padding: 5px 4px;
    display: flex; flex-direction: column; align-items: center;
  }
  .cal-cell-num { font-size: 12px; font-weight: 500; align-self: flex-start; padding-left: 2px; margin-bottom: 2px; }
  .cal-cell-label { font-size: 9.5px; font-weight: 600; text-align: center; line-height: 1.3; }
  .cal-cell-time { font-size: 8px; font-weight: 300; text-align: center; line-height: 1.5; margin-top: 1px; }
  .cal-cell.empty { background: transparent; min-height: 66px; }
  .cal-cell.future { background: var(--soft); border: 1px solid var(--border); }
  .cal-cell.future .cal-cell-num { color: #D1D5DB; }
  .cal-cell.weekend { background: #F3F4F6; border: 1px solid #E5E7EB; }
  .cal-cell.weekend .cal-cell-num { color: var(--text-secondary); }
  .cal-cell.weekend .cal-cell-label { color: #9CA3AF; }
  .cal-cell.norecord { background: var(--soft); border: 1px dashed var(--border); }
  .cal-cell.norecord .cal-cell-num { color: #9CA3AF; }
  .cal-cell.work { background: #DCFCE7; border: 1px solid #86EFAC; }
  .cal-cell.work .cal-cell-num { color: var(--green-dark); }
  .cal-cell.work .cal-cell-label { color: var(--green-dark); }
  .cal-cell.work .cal-cell-time { color: #166534; }
  .cal-cell.leave { background: var(--danger-bg); border: 1px solid #FCA5A5; }
  .cal-cell.leave .cal-cell-num { color: var(--danger); }
  .cal-cell.leave .cal-cell-label { color: var(--danger); }
  .cal-cell.absent { background: #FFF7ED; border: 1px solid #FED7AA; }
  .cal-cell.absent .cal-cell-num { color: var(--orange); }

<script>
const SESSION_KEY = 'easy_firebase_page';

const THAI_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

let allStaff = [];
let allTimesheets = [];
let allAdvances = [];
let settings = {};
let currentGroup = null;
let currentStaffData = null;
let manualAdjust = 0;
let paidStaffIds = new Set();
let viewingPrevious = false;

// ─── HELPERS ───
function toDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function thaiDate(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr + 'T00:00:00');
  return `${d.getDate()} ${THAI_MONTHS[d.getMonth()]} ${d.getFullYear()+543}`;
}

const THAI_DAYS = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
function thaiDateFull(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr + 'T00:00:00');
  return `วัน${THAI_DAYS[d.getDay()]}ที่ ${d.getDate()} ${THAI_MONTHS[d.getMonth()]} ${d.getFullYear()+543}`;
}

function formatMoney(n) {
  return '฿' + Number(n||0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return toDateStr(d);
}

function periodLabel(start, end) {
  const s = new Date(start + 'T00:00:00');
  const e = new Date(end + 'T00:00:00');
  if (s.getMonth() === e.getMonth()) {
    return `${s.getDate()}–${e.getDate()} ${THAI_MONTHS[s.getMonth()]} ${s.getFullYear()+543}`;
  }
  return `${s.getDate()} ${THAI_MONTHS[s.getMonth()]} – ${e.getDate()} ${THAI_MONTHS[e.getMonth()]} ${e.getFullYear()+543}`;
}

// ─── PERIOD ───
function getCurrentPeriods() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  const dow = now.getDay();

  let ftStart, ftEnd, ftPayDate;
  // พนักงานประจำ (ถ้าวันนี้เป็นวันที่ 16 พอดี ให้ยังคงแสดงยอดของวันที่ 1-15 อยู่)
  if (d === 16) {
    ftStart = toDateStr(new Date(y, m, 1));
    ftEnd = toDateStr(new Date(y, m, 15));
    ftPayDate = toDateStr(new Date(y, m, 16));
  } else if (d === 1) { // ถ้าวันนี้เป็นวันที่ 1 พอดี ให้ยังคงแสดงยอดของวันที่ 16-สิ้นเดือนก่อนอยู่
    let lastM = m - 1; let lastY = y;
    if (lastM < 0) { lastM = 11; lastY--; }
    let lastDay = new Date(lastY, lastM + 1, 0).getDate();
    ftStart = toDateStr(new Date(lastY, lastM, 16));
    ftEnd = toDateStr(new Date(lastY, lastM, lastDay));
    ftPayDate = toDateStr(new Date(y, m, 1));
  } else if (d > 1 && d < 16) {
    ftStart = toDateStr(new Date(y, m, 1));
    ftEnd = toDateStr(new Date(y, m, 15));
    ftPayDate = toDateStr(new Date(y, m, 16));
  } else {
    const lastDay = new Date(y, m+1, 0).getDate();
    ftStart = toDateStr(new Date(y, m, 16));
    ftEnd = toDateStr(new Date(y, m, lastDay));
    ftPayDate = toDateStr(new Date(y, m+1, 1));
  }

  // พาร์ทไทม์ (ถ้าวันนี้เป็นวันจันทร์ ให้ยังคงแสดงยอดของจันทร์-อาทิตย์ที่แล้วอยู่)
  let ptMon = new Date(now);
  if (dow === 1) {
    ptMon.setDate(now.getDate() - 7);
  } else {
    const mondayOffset = dow === 0 ? -6 : 1 - dow;
    ptMon.setDate(now.getDate() + mondayOffset);
  }
  const ptSun = new Date(ptMon);
  ptSun.setDate(ptMon.getDate() + 6);
  const ptPay = new Date(ptMon);
  ptPay.setDate(ptMon.getDate() + 7);

  return {
    ftStart, ftEnd, ftPayDate,
    ftIsPayDay: toDateStr(now) === ftPayDate || toDateStr(now) === addDays(ftPayDate, 1),
    ptStart: toDateStr(ptMon), ptEnd: toDateStr(ptSun), ptPayDate: toDateStr(ptPay),
    ptIsPayDay: dow === 1
  };
}

function getPreviousPeriods() {
  const cur = getCurrentPeriods();
  const ftS = new Date(cur.ftStart);
  let prevFtStart, prevFtEnd, prevFtPayDate;
  if (ftS.getDate() === 1) {
    let lastM = ftS.getMonth() - 1, lastY = ftS.getFullYear();
    if (lastM < 0) { lastM = 11; lastY--; }
    const lastDay = new Date(lastY, lastM + 1, 0).getDate();
    prevFtStart = toDateStr(new Date(lastY, lastM, 16));
    prevFtEnd = toDateStr(new Date(lastY, lastM, lastDay));
    prevFtPayDate = cur.ftStart;
  } else {
    prevFtStart = toDateStr(new Date(ftS.getFullYear(), ftS.getMonth(), 1));
    prevFtEnd = toDateStr(new Date(ftS.getFullYear(), ftS.getMonth(), 15));
    prevFtPayDate = toDateStr(new Date(ftS.getFullYear(), ftS.getMonth(), 16));
  }
  const ptS = new Date(cur.ptStart);
  const prevPtMon = new Date(ptS); prevPtMon.setDate(ptS.getDate() - 7);
  const prevPtSun = new Date(prevPtMon); prevPtSun.setDate(prevPtMon.getDate() + 6);
  const prevPtPay = new Date(prevPtMon); prevPtPay.setDate(prevPtMon.getDate() + 7);
  return {
    ftStart: prevFtStart, ftEnd: prevFtEnd, ftPayDate: prevFtPayDate, ftIsPayDay: false,
    ptStart: toDateStr(prevPtMon), ptEnd: toDateStr(prevPtSun), ptPayDate: toDateStr(prevPtPay), ptIsPayDay: false
  };
}

// ─── ADVANCE HELPERS ───
function getAdvancesForStaffPeriod(staffId, periodStart, periodEnd) {
  return allAdvances.filter(a =>
    String(a.staff_id) === String(staffId) &&
    a.status === 'pending' &&
    a.period_start === periodStart &&
    a.period_end === periodEnd
  );
}

function totalAdvanceAmount(staffId, periodStart, periodEnd) {
  return getAdvancesForStaffPeriod(staffId, periodStart, periodEnd)
    .reduce((sum, a) => sum + parseFloat(a.amount || 0), 0);
}

// ─── PAYROLL CALC ───
function getEffectiveShift(staff, dateStr, settings) {
  // วันอาทิตย์ → ทุกคนทุกสาขาใช้ 10:30–20:00
  const d = new Date(dateStr + 'T00:00:00');
  if (d.getDay() === 0) return { start: '10:30', end: '20:00', flexible: false };

  // ใช้ custom shift ต่อคน (จาก Sheets)
  if (staff.custom_shift_start) {
    return {
      start: staff.custom_shift_start,
      end: staff.custom_shift_end || null,
      flexible: !staff.custom_shift_end
    };
  }

  // 🔴 FIXED: ถ้าเป็น part-time และไม่ได้ใส่เวลา ให้เป็น Flexible ทันที ห้ามดึงค่า Global
  if (staff.staff_type !== 'fulltime') {
    return { start: null, end: null, flexible: true };
  }

  // fallback → global settings (สำหรับ fulltime เท่านั้น)
  const start = staff.shift === 'night' ? (settings.shift_night_start || '17:00') : (settings.shift_morning_start || '09:00');
  const end   = staff.shift === 'night' ? (settings.shift_night_end   || '01:00') : (settings.shift_morning_end   || '17:00');
  return { start, end, flexible: false };
}

function calcHoursBetween(startStr, endStr, shift) {
  if (!startStr || !endStr) return 0;
  const [sh, sm] = startStr.split(':').map(Number);
  const [eh, em] = endStr.split(':').map(Number);
  let s = sh * 60 + sm, e = eh * 60 + em;
  if (shift === 'night' && e < s) e += 1440;
  return Math.max(0, parseFloat(((e - s) / 60).toFixed(2)));
}

function calcPayroll(staff, timesheets, periodStart, periodEnd) {
  const ts = timesheets.filter(t => {
    const td = typeof t.date === 'string' ? t.date.substring(0,10) : toDateStr(new Date(t.date));
    return t.staff_id === staff.staff_id && td >= periodStart && td <= periodEnd;
  });

  const rate = parseFloat(staff.rate) || 0;
  // ดึงเรท OT จากหน้า staff มาใช้เป็นหลัก ถ้าไม่มีค่อยใช้ค่ากลาง
  const otRatePerHour = parseFloat(staff.ot_rate) || parseFloat(settings.ot_rate_per_hour) || 50;
  const lateGrace = parseInt(settings.late_grace_min) || 15;

  let basePay = 0, otPay = 0, lateDeduct = 0;
  let daysWorked = 0, hoursWorked = 0;
  let details = [], pendingOTs = [];

  ts.forEach(t => {
    if (!t.clock_in) return;
    const lateMin = parseInt(t.late_min) || 0;
    const otHours = parseFloat(t.ot_hours) || 0;
    const otApproved = t.ot_status === 'approved';
    const otPending = t.ot_status === 'pending';

    let dayBase = 0, dayDeduct = 0, dayOT = 0;
    let effectiveClockIn = null, effectiveClockOut = null;

    if (staff.pay_type === 'daily') {
      dayBase = rate; daysWorked++;
      // หักสายเฉพาะ fulltime (part-time daily เช่น ต้น ไม่หัก)
      if (staff.staff_type === 'fulltime' && lateMin > lateGrace) {
        dayDeduct = parseFloat(((rate / 480) * lateMin).toFixed(2));
        lateDeduct += dayDeduct;
      }
    } else {
      // Part-time hourly: ตัดเวลาตาม shift จริงของแต่ละคน/วัน
      let hrs = parseFloat(t.hours_worked) || 0;
      if (t.clock_in && t.clock_out) {
        const shiftInfo = getEffectiveShift(staff, t.date, settings);
        let eIn = t.clock_in, eOut = t.clock_out;
        if (!shiftInfo.flexible) {
          if (shiftInfo.start && t.clock_in < shiftInfo.start) {
            eIn = shiftInfo.start;
            effectiveClockIn = shiftInfo.start;
          }
          if (shiftInfo.end && t.clock_out > shiftInfo.end) {
            eOut = shiftInfo.end;
            effectiveClockOut = shiftInfo.end;
          }
        }
        hrs = calcHoursBetween(eIn, eOut, staff.shift);
      }
      dayBase = parseFloat((rate * hrs).toFixed(2));
      hoursWorked += parseFloat(hrs.toFixed(2));
    }

    if (otHours > 0 && otApproved) {
      dayOT = parseFloat((otHours * otRatePerHour).toFixed(2));
      otPay += dayOT;
    }

    if (otPending) {
      pendingOTs.push({ record_id: t.record_id, date: t.date, ot_hours: otHours, ot_reason: t.ot_reason || '—' });
    }

    basePay += dayBase;
    details.push({
      date: t.date, clock_in: t.clock_in, clock_out: t.clock_out,
      late_min: lateMin, late_deduct: dayDeduct,
      ot_hours: otHours, ot_pay: dayOT, ot_status: t.ot_status,
      ot_reason: t.ot_reason, record_id: t.record_id,
      day_total: parseFloat((dayBase - dayDeduct + dayOT).toFixed(2)),
      effective_clock_in: effectiveClockIn,
      effective_clock_out: effectiveClockOut
    });
  });

  // เบิกล่วงหน้า
  const advanceTotal = totalAdvanceAmount(staff.staff_id, periodStart, periodEnd);
  const advanceItems = getAdvancesForStaffPeriod(staff.staff_id, periodStart, periodEnd);

  const subtotal = parseFloat((basePay - lateDeduct + otPay).toFixed(2));
  const total = parseFloat((subtotal - advanceTotal).toFixed(2));

  return {
    staff, days_worked: daysWorked,
    hours_worked: parseFloat(hoursWorked.toFixed(2)),
    base_pay: parseFloat(basePay.toFixed(2)),
    ot_pay: parseFloat(otPay.toFixed(2)),
    late_deduct: parseFloat(lateDeduct.toFixed(2)),
    advance_total: parseFloat(advanceTotal.toFixed(2)),
    advance_items: advanceItems,
    subtotal, total,
    details, pendingOTs, ts_count: ts.length
  };
}

// ─── OPEN GROUP ───
async function openGroup(type) {
  currentGroup = type;
  paidStaffIds = new Set();
  showLoading(true);

  const periods = viewingPrevious ? getPreviousPeriods() : getCurrentPeriods();
  const isFulltime = type === 'fulltime';
  const staff = allStaff.filter(s => s.role !== 'admin' && (isFulltime ? s.pay_type === 'daily' : s.pay_type === 'hourly'));
  const start = isFulltime ? periods.ftStart : periods.ptStart;
  const end = isFulltime ? periods.ftEnd : periods.ptEnd;
  const payDate = isFulltime ? periods.ftPayDate : periods.ptPayDate;

  try {
    const [tsRes, prRes, advRes] = await Promise.all([
      apiGet(`action=getTimesheets&date_from=${start}&date_to=${end}`),
      apiGet('action=getPayrollRuns'),
      apiGet('action=getAdvances&status=pending')
    ]);
    allTimesheets = tsRes.success ? tsRes.data : [];
    allAdvances = advRes.success ? advRes.data : [];

    if (prRes.success) {
      prRes.data.forEach(pr => {
        if (pr.period_start === start && pr.period_end === end && pr.status === 'paid') {
          paidStaffIds.add(pr.staff_id);
        }
      });
    }
  } catch {}

  const payrolls = staff.map(s => calcPayroll(s, allTimesheets, start, end));

  document.getElementById('list-title').textContent = isFulltime ? '💼 พนักงานประจำ' : '👤 Part-time';
document.getElementById('list-sub').textContent = `${viewingPrevious ? '📌 รอบที่แล้ว · ' : ''}${periodLabel(start, end)} · จ่าย ${thaiDate(payDate)}`;
  let html = '';
  if (!payrolls.length) {
    html = '<div class="empty-state"><div class="empty-icon">👥</div><div class="empty-text">ไม่พบพนักงาน</div></div>';
  } else {
    payrolls.forEach(p => {
      const isPaid = paidStaffIds.has(p.staff.staff_id);
      const initials = (p.staff.nickname || p.staff.name || '?').charAt(0);
      const workLabel = isFulltime ? `${p.days_worked} วัน` : `${p.hours_worked} ชม.`;
      const hasPendingOT = p.pendingOTs.length > 0;
      const hasAdvance = p.advance_total > 0;
      const isEmpty = p.ts_count === 0;

      let statusClass = isPaid ? 'status-paid' : (isEmpty ? 'status-missing' : 'status-ready');
      let statusLabel = isPaid ? '✅ จ่ายแล้ว' : (isEmpty ? '⚠️ ไม่มีข้อมูล' : '📋 พร้อมจ่าย');

      html += `
        <div class="staff-card ${isPaid ? 'is-paid' : ''}" onclick="openDetail('${p.staff.staff_id}', '${start}', '${end}', '${payDate}')">
          <div class="staff-card-top">
            <div class="staff-avatar ${isPaid ? 'paid' : ''}">${isPaid ? '✓' : initials}</div>
            <div class="staff-info">
              <div class="staff-name">${p.staff.nickname || p.staff.name}</div>
              <div class="staff-meta">${isFulltime ? `฿${p.staff.rate}/วัน` : `฿${p.staff.rate}/ชม.`} · ${workLabel}</div>
            </div>
            <div class="staff-right">
              <div class="staff-amount">${formatMoney(p.total)}</div>
              <div class="staff-amount-label">ยอดสุทธิ</div>
            </div>
          </div>
          <div class="staff-card-bottom">
            <div class="staff-chips">
              ${p.late_deduct > 0 ? `<span class="chip chip-late">หัก ฿${p.late_deduct.toFixed(0)}</span>` : ''}
              ${p.ot_pay > 0 ? `<span class="chip chip-ot">OT ฿${p.ot_pay.toFixed(0)}</span>` : ''}
              ${hasPendingOT ? `<span class="chip chip-ot-pending">⏰ OT รออนุมัติ</span>` : ''}
              ${hasAdvance ? `<span class="chip chip-advance">เบิกล่วงหน้า -฿${p.advance_total.toFixed(0)}</span>` : ''}
              ${!p.late_deduct && !p.ot_pay && !hasPendingOT && !hasAdvance && !isEmpty ? `<span class="chip chip-ok">ปกติ</span>` : ''}
            </div>
            <div class="staff-status ${statusClass}">${statusLabel}</div>
          </div>
        </div>`;
    });
  }

  document.getElementById('staff-list-body').innerHTML = html;
  document.getElementById('main-page').style.display = 'none';
  document.getElementById('main-header').style.display = 'none';
  document.getElementById('staff-list-page').style.display = 'block';
  showLoading(false);
}

function backToMain() {
  document.getElementById('staff-list-page').style.display = 'none';
  document.getElementById('main-page').style.display = 'block';
  document.getElementById('main-header').style.display = 'block';
  currentGroup = null;
}

// ─── DETAIL ───

  const staff = allStaff.find(s => s.staff_id === staffId);
  const payroll = calcPayroll(staff, allTimesheets, start, end);
  const isPaid = paidStaffIds.has(staffId);

  currentStaffData = { payroll, start, end, payDate, isPaid };
  manualAdjust = 0;

  document.getElementById('d-avatar').textContent = (staff.nickname || staff.name || '?').charAt(0);
  document.getElementById('d-name').textContent = staff.name;
  document.getElementById('d-meta').textContent = `${staff.staff_type === 'fulltime' ? 'พนักงานประจำ' : 'Part-time'} · ${staff.shift === 'morning' ? 'กะเช้า' : 'กะดึก'}`;

  renderDetailBody();
  document.getElementById('detail-overlay').classList.add('visible');
}

function copyAccount(account) {
  navigator.clipboard.writeText(account).then(() => {
    showToast('📋 คัดลอกเลขบัญชีแล้ว', 'success');
  }).catch(() => showToast('คัดลอกไม่ได้ กรุณา copy เอง', 'error'));
}

function liveAdjust(val) {
  manualAdjust = parseFloat(val) || 0;
  const note = document.getElementById('adjust-note')?.value || '';
  renderDetailBody();
  setTimeout(() => {
    const inp = document.getElementById('adjust-amount');
    if (inp) { inp.focus(); inp.value = val; }
    const noteEl = document.getElementById('adjust-note');
    if (noteEl) noteEl.value = note;
  }, 10);
}

async function approveOT(recordId, approve) {
  showLoading(true);
  try {
    await apiPost({ action: 'updateTimesheetOT', record_id: recordId, ot_status: approve ? 'approved' : 'rejected' });
    showToast(approve ? '✅ อนุมัติ OT แล้ว' : '❌ ปฏิเสธ OT แล้ว', approve ? 'success' : '');
    const res = await apiGet(`action=getTimesheets&date_from=${currentStaffData.start}&date_to=${currentStaffData.end}`);
    allTimesheets = res.success ? res.data : [];
    currentStaffData.payroll = calcPayroll(currentStaffData.payroll.staff, allTimesheets, currentStaffData.start, currentStaffData.end);
    renderDetailBody();
  } catch { showToast('เกิดข้อผิดพลาด', 'error'); }

}

async function confirmPayroll() {
  if (!currentStaffData) return;
  const { payroll, start, end, payDate } = currentStaffData;
  const adjustNote = document.getElementById('adjust-note')?.value || '';
  const totalWithAdjust = payroll.total + manualAdjust;

  showLoading(true);
  try {
    // บันทึก payroll run
    await apiPost({
      action: 'savePayrollRun',
      advance_ids: payroll.advance_items.map(a => a.advance_id),
      staff_id: payroll.staff.staff_id,
      period_start: start, period_end: end, pay_date: payDate,
      days_worked: payroll.days_worked, hours_worked: payroll.hours_worked,
      base_pay: payroll.base_pay, ot_pay: payroll.ot_pay,
      late_deduct: payroll.late_deduct,
      early_out_deduct: 0,
      manual_adjust: manualAdjust, adjust_note: adjustNote,
      total_pay: totalWithAdjust, status: 'paid',
      paid_at: new Date().toISOString()
    });

    // อัปเดต advances เป็น deducted
    if (payroll.advance_items.length > 0) {
      await apiPost({
        action: 'markAdvancesDeducted',
        advance_ids: payroll.advance_items.map(a => a.advance_id)
      });
    }

    // แจ้ง Telegram
    await apiPost({
      action: 'sendPayrollNotify',
      staff_name: payroll.staff.nickname || payroll.staff.name,
      total_pay: totalWithAdjust,
      period_start: start, period_end: end
    });

    paidStaffIds.add(payroll.staff.staff_id);
    currentStaffData.isPaid = true;

    showToast(`✅ จ่าย ${formatMoney(totalWithAdjust)} ให้ ${payroll.staff.nickname || payroll.staff.name} แล้ว`, 'success');

    renderDetailBody();

  // --- ระบบปัดลงเพื่อปิด (อัปเดตใหม่: จับเฉพาะขีดสีเทาด้านบนสุดเพื่อป้องกันการเลื่อนทับกับเนื้อหา) ---
let startY = 0, currentY = 0, isDragging = false, activeSheet = null;

document.addEventListener('touchstart', (e) => {
  // เงื่อนไข: ให้ลากได้เฉพาะตอนจับที่ "ขีดสีเทา" หรือ "ชื่อหัวข้อ" ด้านบนสุดเท่านั้น
  const dragArea = e.target.closest('.modal-handle, .sheet-handle, .modal-title, .summary-title');
  if (!dragArea) return; // ถ้าจับตรงเนื้อหา จะไม่ทำงาน (จะได้ใช้นิ้วเลื่อนอ่านข้อมูลข้างในได้ปกติ)

  const sheet = dragArea.closest('.modal-sheet, .summary-sheet');
  if (!sheet) return;

  activeSheet = sheet;
  startY = e.touches[0].clientY;
  isDragging = true;
  activeSheet.style.transition = 'none'; // ปิดแอนิเมชันให้ลากตามนิ้วเนียนๆ
}, { passive: true });

document.addEventListener('touchmove', (e) => {
  if (!isDragging || !activeSheet) return;
  currentY = e.touches[0].clientY;
  const deltaY = currentY - startY;

  if (deltaY > 0) { // อนุญาตให้ลากลงเท่านั้น
    if (e.cancelable) e.preventDefault(); // ล็อกหน้าจอด้านหลังไม่ให้ขยับ
    activeSheet.style.transform = `translateY(${deltaY}px)`;
  }
}, { passive: false });

document.addEventListener('touchend', (e) => {
  if (!isDragging || !activeSheet) return;
  isDragging = false;
  activeSheet.style.transition = 'transform 0.3s cubic-bezier(0.32, 0.72, 0, 1)'; // เปิดแอนิเมชันกลับมา

  const deltaY = currentY - startY;
  if (deltaY > 120) {
    // ถ้ารูดลงมายาวพอ ให้ปิด Modal
    const overlay = activeSheet.closest('.modal-overlay, .summary-overlay');
    if (overlay) overlay.classList.remove('visible');
    
    // รีเซ็ตตำแหน่งหลังปิดเสร็จ (หน่วงเวลาให้มันไหลลงไปให้สุดก่อน)
    setTimeout(() => { if (activeSheet) activeSheet.style.transform = ''; activeSheet = null; }, 300);
  } else {
    // ถ้ารูดลงมานิดเดียว ให้เด้งกลับไปตำแหน่งเดิม
    activeSheet.style.transform = '';
    activeSheet = null;
  }
});

// ─── CALENDAR ───
const THAI_MONTHS_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
  'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

let calStaffId = null, calYear = null, calMonth = null;
let calTimesheets = [], calLeaves = [];
let calDayOffSet = new Set([0]); // default: หยุดอาทิตย์

async function openCalendar(staffId) {
  calStaffId = staffId;
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
  const staff = allStaff.find(s => s.staff_id === staffId);
  document.getElementById('cal-staff-name').textContent = staff ? (staff.name || staff.nickname || staffId) : staffId;

  // parse day_off จาก staff (เช่น "0" หรือ "0,6")
  calDayOffSet = new Set();
  const dayOffRaw = String(staff?.day_off ?? '0');
  dayOffRaw.split(',').forEach(d => {
    const n = parseInt(d.trim());
    if (!isNaN(n)) calDayOffSet.add(n);
  });

  await loadCalData();
  document.getElementById('cal-overlay').classList.add('visible');
}

async function loadCalData() {
  const y = calYear, m = String(calMonth + 1).padStart(2, '0');
  const firstDay = `${y}-${m}-01`;
  const lastDay = toDateStr(new Date(y, calMonth + 1, 0));
  showLoading(true);
  try {
    const [tsRes, leaveRes] = await Promise.all([
      apiGet(`action=getTimesheets&date_from=${firstDay}&date_to=${lastDay}`),
      apiGet(`action=getLeaves&date_from=${firstDay}&date_to=${lastDay}`).catch(() => ({ success: false }))
    ]);
    calTimesheets = (tsRes.success ? tsRes.data : []).filter(t => String(t.staff_id) === String(calStaffId));
    calLeaves = leaveRes.success ? (leaveRes.data || []).filter(l => String(l.staff_id) === String(calStaffId)) : [];
  } catch {
    calTimesheets = []; calLeaves = [];
  }
  showLoading(false);
  renderCalendar();
}

function renderCalendar() {
  document.getElementById('cal-month-label').textContent = `${THAI_MONTHS_FULL[calMonth]} ${calYear + 543}`;
  const today = toDateStr(new Date());
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const firstWeekday = new Date(calYear, calMonth, 1).getDay();

  // map timesheet by date
  const tsMap = {};
  calTimesheets.forEach(t => {
    const d = typeof t.date === 'string' ? t.date.substring(0, 10) : toDateStr(new Date(t.date));
    tsMap[d] = t;
  });

  // map manual leave by date (override)
  const leaveMap = {};
  calLeaves.forEach(l => {
    const d = typeof l.date === 'string' ? l.date.substring(0, 10) : toDateStr(new Date(l.date));
    leaveMap[d] = l;
  });

  let cells = '';
  let absentCount = 0, workCount = 0;

  for (let i = 0; i < firstWeekday; i++) {
    cells += `<div class="cal-cell empty"></div>`;
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const mm = String(calMonth + 1).padStart(2, '0');
    const dd = String(day).padStart(2, '0');
    const dateStr = `${calYear}-${mm}-${dd}`;
    const dow = new Date(dateStr + 'T00:00:00').getDay();
    const isToday = dateStr === today;
    const isFuture = dateStr > today;
    const isDayOff = calDayOffSet.has(dow);
    const ts = tsMap[dateStr];
    const leaveObj = leaveMap[dateStr];

    let cellClass = '', labelHtml = '', onclickAttr = '';

    if (isFuture) {
      // อนาคต: แสดงแค่เทา ไม่ต้องทำอะไร
      cellClass = isDayOff ? 'weekend' : 'future';
    } else if (leaveObj) {
      // มี leave record บันทึกไว้ manual = "ลา" (สีแดง, override)
      cellClass = 'leave';
      const leaveTypeLabel = leaveObj.leave_type || 'ลา';
      labelHtml = `<div class="cal-cell-label">${leaveTypeLabel}</div>`;
      onclickAttr = `onclick="openLeaveDelete('${leaveObj.leave_id}','${dateStr}')"`;
    } else if (ts && ts.clock_in) {
      // มีการเข้างาน = ทำงาน (สีเขียว)
      cellClass = 'work';
      const inT = ts.clock_in || '—';
      const outT = ts.clock_out || '—';
      labelHtml = `<div class="cal-cell-label">ทำงาน</div><div class="cal-cell-time">${inT}<br>${outT}</div>`;
      onclickAttr = `onclick="openTimesheetEditor('${dateStr}')"`;
      workCount++;
    } else if (isDayOff) {
      // วันหยุดตามตาราง (day_off) = เทา
      cellClass = 'weekend';
      labelHtml = `<div class="cal-cell-label">หยุด</div>`;
    } else {
      // ——— AUTO-DETECT: ผ่านมาแล้ว + ไม่ใช่วันหยุด + ไม่มี timesheet = ขาด ———
      cellClass = 'absent';
      labelHtml = `<div class="cal-cell-label">ขาด</div>`;
      onclickAttr = `onclick="openTimesheetEditor('${dateStr}')"`;
      absentCount++;
    }

    if (isToday) cellClass += ' today-ring';
    const numStyle = isDayOff ? 'color:#9CA3AF' : '';
    cells += `<div class="cal-cell ${cellClass}" ${onclickAttr} style="${onclickAttr ? 'cursor:pointer' : ''}">
      <div class="cal-cell-num" style="${numStyle}">${day}</div>${labelHtml}
    </div>`;
  }

  document.getElementById('cal-grid').innerHTML = cells;

  // แสดง summary stat ใต้ปฎิทิน
  const statsEl = document.getElementById('cal-stats');
  if (statsEl) {
    statsEl.innerHTML = absentCount > 0
      ? `<span style="color:var(--orange);font-weight:500">ขาด ${absentCount} วัน</span>&ensp;·&ensp;<span style="color:var(--green-dark)">ทำงาน ${workCount} วัน</span>`
      : `<span style="color:var(--green-dark)">ทำงาน ${workCount} วัน ✓</span>`;
  }
}

async function changeCalMonth(delta) {
  calMonth += delta;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0) { calMonth = 11; calYear--; }
  await loadCalData();
}

function closeCalendar() { document.getElementById('cal-overlay').classList.remove('visible'); }

// ─── ADMIN TIMESHEET EDITOR ───
let editingTimesheet = null;

function toTimeInput(value) {
  return value ? String(value).substring(0, 5) : '';
}

function openTimesheetEditor(dateStr) {
  const record = calTimesheets.find(t => {
    const date = typeof t.date === 'string' ? t.date.substring(0, 10) : toDateStr(new Date(t.date));
    return date === dateStr;
  }) || null;
  const staff = allStaff.find(s => String(s.staff_id) === String(calStaffId));
  const name = staff?.nickname || staff?.name || 'พนักงาน';

  editingTimesheet = { date: dateStr, record };
  document.getElementById('te-title').textContent = record ? '✏️ แก้ไขเวลาทำงาน' : '➕ เพิ่มเวลาทำงานย้อนหลัง';
  document.getElementById('te-sub').textContent = `${name} · ${thaiDateFull(dateStr)}`;
  document.getElementById('te-clock-in').value = toTimeInput(record?.clock_in);
  document.getElementById('te-clock-out').value = toTimeInput(record?.clock_out);
  document.getElementById('te-note').value = record?.admin_note || record?.edit_note || '';
  document.getElementById('te-leave-link').style.display = record ? 'none' : '';
  document.getElementById('timesheet-editor-overlay').classList.add('visible');
}

function closeTimesheetEditor() {
  document.getElementById('timesheet-editor-overlay').classList.remove('visible');
  editingTimesheet = null;
}

function closeTimesheetEditorOutside(e) {
  if (e.target === document.getElementById('timesheet-editor-overlay')) closeTimesheetEditor();
}

function openLeaveFromTimesheetEditor() {
  const date = editingTimesheet?.date;
  closeTimesheetEditor();
  if (date) openLeaveAdd(date);
}

async function saveTimesheetEdit() {
  if (!editingTimesheet || !calStaffId) return;
  const clockIn = document.getElementById('te-clock-in').value;
  const clockOut = document.getElementById('te-clock-out').value;
  const note = document.getElementById('te-note').value.trim();

  if (!clockIn) return showToast('กรุณาระบุเวลาเข้างาน', 'error');
  if (!clockOut) return showToast('กรุณาระบุเวลาออกงาน', 'error');
  if (!note) return showToast('กรุณาระบุเหตุผลที่แก้ไข', 'error');
  if (clockIn === clockOut) return showToast('เวลาเข้าและออกต้องไม่เท่ากัน', 'error');

  showLoading(true);
  try {
    const res = await apiPost({
      action: 'upsertTimesheet',
      record_id: editingTimesheet.record?.record_id || '',
      staff_id: calStaffId,
      date: editingTimesheet.date,
      clock_in: clockIn,
      clock_out: clockOut,
      admin_note: note,
      is_manual: 'yes'
    });
    if (!res.success) throw new Error(res.message || 'บันทึกไม่สำเร็จ');
    closeTimesheetEditor();
    showToast('✅ บันทึกเวลาเรียบร้อย', 'success');
    await loadCalData();
    if (currentStaffData && String(currentStaffData.payroll.staff.staff_id) === String(calStaffId)) {
      const tsRes = await apiGet(`action=getTimesheets&date_from=${currentStaffData.start}&date_to=${currentStaffData.end}`);
      allTimesheets = tsRes.success ? tsRes.data : allTimesheets;
      currentStaffData.payroll = calcPayroll(currentStaffData.payroll.staff, allTimesheets, currentStaffData.start, currentStaffData.end);
      renderDetailBody();
    }
  } catch (err) {
    showToast(err.message || 'บันทึกไม่สำเร็จ', 'error');
  }
  showLoading(false);
}

function selectLeaveType(btn, type) {

}

function closeLeaveAction() { document.getElementById('leave-action-overlay').classList.remove('visible'); }
function closeLeaveActionOutside(e) { if (e.target === document.getElementById('leave-action-overlay')) closeLeaveAction(); }

async function confirmSaveLeave() {
  if (!currentLeaveDate || !calStaffId) return;
  const note = document.getElementById('la-note').value.trim();
  showLoading(true); closeLeaveAction();
  try {
    const res = await apiPost({

async function confirmDeleteLeave() {
  if (!currentLeaveId) return;

    const res = await apiPost({ action: 'deleteLeave', leave_id: currentLeaveId });

}

async function exportToImage(event) {
  const overlay = document.getElementById('detail-overlay');
  const element = document.querySelector('#detail-overlay .detail-sheet');
  const btn = event.target;
  const originalText = btn.innerText;
  
  btn.innerText = "⏳ รอสักครู่...";
  btn.disabled = true;

  // 1. เก็บค่าเดิมของตัวลูกและตัวแม่
  const origMaxHeight = element.style.maxHeight;
  const origOverflow = element.style.overflow;
  const origPosition = element.style.position;
  const origTransform = element.style.transform;
  const origOverlayPos = overlay.style.position;

  // 2. ปลดล็อคขั้นสุดสำหรับมือถือ (ปล่อยให้ทะลุจอชั่วคราว)
  element.style.maxHeight = 'none';
  element.style.overflow = 'visible';
  element.style.position = 'relative'; // ปลดล็อคไม่ให้ยึดติดขอบล่าง
  element.style.transform = 'none';
  overlay.style.position = 'absolute'; // ปลดล็อคตัวแม่ไม่ให้ตัดขอบจอ
  
  // 3. ดันจอขึ้นบนสุดป้องกันแคนวาสแหว่ง
  element.scrollTop = 0;
  window.scrollTo(0, 0);

  try {
    const canvas = await html2canvas(element, {
      scale: 2, 
      useCORS: true,
      logging: false,
      backgroundColor: "#F5F7FB", 
      windowHeight: element.scrollHeight, // บังคับอ่านความสูงจริงทั้งหมด
      ignoreElements: (el) => el.tagName === 'BUTTON'
    });

    const link = document.createElement('a');
    const name = document.getElementById('d-name').innerText;
    link.download = `สรุปยอด_${name}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    
    showToast("บันทึกรูปภาพเรียบร้อย!", "success");
  } catch (err) {
    console.error(err);
    showToast("เกิดข้อผิดพลาดในการสร้างรูป", "error");
  } finally {
    // 4. หดทุกอย่างกลับเข้าที่เดิมเนียนๆ
    element.style.maxHeight = origMaxHeight;
    element.style.overflow = origOverflow;
    element.style.position = origPosition;
    element.style.transform = origTransform;
    overlay.style.position = origOverlayPos;

    btn.innerText = originalText;
    btn.disabled = false;
  }
}
