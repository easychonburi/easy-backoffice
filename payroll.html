<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EASY — Payroll</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #E5232B;
    --red-dark: #C81D24;
    --yellow: #FFC928;
    --bg: #F5F7FB;
    --white: #FFFFFF;
    --soft: #F9FAFB;
    --border: #E5E7EB;
    --text: #1F2937;
    --text-secondary: #6B7280;
    --green: #22C55E;
    --green-dark: #16A34A;
    --green-bg: #DCFCE7;
    --danger: #FF5A4F;
    --danger-bg: #FEE2E2;
    --blue: #3B82F6;
    --blue-bg: #EFF6FF;
    --orange: #F97316;
    --orange-bg: #FFF7ED;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Prompt', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ─── HEADER ─── */
  .app-header {
    background: var(--red);
    padding: 48px 20px 24px;
    border-radius: 0 0 28px 28px;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .header-logo { font-size: 20px; font-weight: 700; color: var(--yellow); }
  .header-title { font-size: 22px; font-weight: 600; color: white; margin-bottom: 2px; }
  .header-sub { font-size: 13px; color: rgba(255,255,255,0.7); font-weight: 300; }

  .logout-btn {
    background: rgba(255,255,255,0.2);
    border: none; color: white;
    font-family: 'Prompt', sans-serif;
    font-size: 12px; padding: 6px 14px;
    border-radius: 20px; cursor: pointer;
  }
  .logout-btn:active { background: rgba(255,255,255,0.35); }

  /* ─── BODY ─── */
  .app-body { padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; }

  /* ─── CARD ─── */
  .card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }

  /* ─── OT ALERT ─── */
  .ot-alert {
    background: var(--orange-bg);
    border: 1px solid #FED7AA;
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .ot-alert:active { transform: scale(0.99); }
  .ot-alert-icon { font-size: 22px; flex-shrink: 0; }
  .ot-alert-text { flex: 1; }
  .ot-alert-title { font-size: 14px; font-weight: 500; color: var(--orange); }
  .ot-alert-sub { font-size: 12px; color: var(--text-secondary); font-weight: 300; }
  .ot-alert-arrow { font-size: 16px; color: var(--orange); flex-shrink: 0; }

  /* ─── PAY DATE BADGE ─── */
  .pay-date-card {
    background: var(--red);
    border-radius: var(--radius);
    padding: 16px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .pay-date-label { font-size: 12px; color: rgba(255,255,255,0.75); font-weight: 300; margin-bottom: 3px; }
  .pay-date-value { font-size: 18px; font-weight: 600; color: white; }
  .pay-date-badge {
    background: var(--yellow);
    color: #92400E;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
  }
  .pay-date-badge.normal {
    background: rgba(255,255,255,0.2);
    color: white;
    font-weight: 400;
  }

  /* ─── GROUP CARDS ─── */
  .group-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .group-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .group-card:active { transform: scale(0.97); box-shadow: none; }

  .group-icon { font-size: 28px; }
  .group-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .group-period { font-size: 11px; color: var(--text-secondary); font-weight: 300; margin-top: -6px; }
  .group-count { font-size: 12px; color: var(--text-secondary); font-weight: 300; }
  .group-amount { font-size: 20px; font-weight: 700; color: var(--text); }
  .group-amount-label { font-size: 10px; color: var(--text-secondary); font-weight: 300; margin-top: -4px; }

  .group-action {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  .group-action.pay-now { background: var(--red); color: white; }
  .group-action.view-only { background: var(--soft); color: var(--text-secondary); border: 1px solid var(--border); }

  /* ─── STAFF LIST PAGE ─── */
  #staff-list-page { display: none; }

  .back-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 4px;
  }

  .back-btn-inline {
    background: rgba(255,255,255,0.2);
    border: none; color: white;
    font-family: 'Prompt', sans-serif;
    font-size: 13px; padding: 6px 12px;
    border-radius: 20px; cursor: pointer;
  }

  .page-title { font-size: 18px; font-weight: 600; color: white; }
  .page-sub { font-size: 12px; color: rgba(255,255,255,0.7); font-weight: 300; }

  /* ─── STAFF CARD ─── */
  .staff-card {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    overflow: hidden;
    cursor: pointer;
    transition: all 0.2s;
  }
  .staff-card:active { transform: scale(0.99); }

  .staff-card-top {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .staff-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--red);
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600;
    flex-shrink: 0;
  }

  .staff-info { flex: 1; min-width: 0; }
  .staff-name { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
  .staff-meta { font-size: 11px; color: var(--text-secondary); font-weight: 300; }

  .staff-amount-wrap { text-align: right; flex-shrink: 0; }
  .staff-amount { font-size: 18px; font-weight: 700; color: var(--text); }
  .staff-amount-label { font-size: 10px; color: var(--text-secondary); font-weight: 300; }

  .staff-card-bottom {
    padding: 8px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .staff-chips { display: flex; gap: 6px; flex-wrap: wrap; }

  .chip {
    font-size: 11px; font-weight: 400;
    padding: 3px 8px;
    border-radius: 10px;
  }
  .chip-late { background: var(--danger-bg); color: var(--danger); }
  .chip-ot { background: var(--orange-bg); color: var(--orange); }
  .chip-ot-pending { background: var(--orange-bg); color: var(--orange); }
  .chip-ok { background: var(--green-bg); color: var(--green-dark); }
  .chip-missing { background: var(--danger-bg); color: var(--danger); }
  .chip-paid { background: var(--green-bg); color: var(--green-dark); }

  .staff-status {
    font-size: 11px; font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
    flex-shrink: 0;
  }
  .status-ready { background: var(--blue-bg); color: var(--blue); }
  .status-paid { background: var(--green-bg); color: var(--green-dark); }
  .status-missing { background: var(--danger-bg); color: var(--danger); }

  /* ─── DETAIL SHEET ─── */
  .detail-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
  }
  .detail-overlay.visible { opacity: 1; pointer-events: all; }

  .detail-sheet {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: var(--white);
    border-radius: 24px 24px 0 0;
    max-height: 92vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .detail-overlay.visible .detail-sheet { transform: translateY(0); }

  .sheet-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 16px auto 0;
  }

  .sheet-header {
    padding: 16px 20px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .sheet-avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--red);
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 600;
    flex-shrink: 0;
  }

  .sheet-name { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .sheet-meta { font-size: 12px; color: var(--text-secondary); font-weight: 300; }

  .sheet-body { padding: 16px 20px 32px; }

  /* TOTAL BOX */
  .total-box {
    background: var(--red);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .total-box-left {}
  .total-box-label { font-size: 12px; color: rgba(255,255,255,0.75); font-weight: 300; margin-bottom: 4px; }
  .total-box-amount { font-size: 30px; font-weight: 700; color: white; line-height: 1; }
  .total-box-period { font-size: 11px; color: rgba(255,255,255,0.6); font-weight: 300; margin-top: 4px; }
  .total-box-right { text-align: right; }
  .total-box-pay-label { font-size: 11px; color: rgba(255,255,255,0.7); font-weight: 300; margin-bottom: 3px; }
  .total-box-pay-date { font-size: 14px; font-weight: 500; color: white; }

  /* OT PENDING */
  .ot-pending-section {
    background: var(--orange-bg);
    border: 1px solid #FED7AA;
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .ot-pending-title { font-size: 12px; font-weight: 500; color: var(--orange); margin-bottom: 8px; }
  .ot-pending-item {
    background: var(--white);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .ot-pending-item:last-child { margin-bottom: 0; }
  .ot-pending-info { flex: 1; }
  .ot-pending-date { font-size: 13px; font-weight: 500; color: var(--text); }
  .ot-pending-detail { font-size: 11px; color: var(--text-secondary); font-weight: 300; margin-top: 1px; }
  .ot-pending-btns { display: flex; gap: 6px; }
  .ot-btn {
    border: none; border-radius: 8px;
    padding: 6px 12px;
    font-family: 'Prompt', sans-serif;
    font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.2s;
  }
  .ot-btn.approve { background: var(--green-bg); color: var(--green-dark); }
  .ot-btn.reject { background: var(--danger-bg); color: var(--danger); }

  /* BREAKDOWN */
  .breakdown-section { margin-bottom: 14px; }
  .section-label {
    font-size: 11px; color: var(--text-secondary);
    font-weight: 400; text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 8px;
  }
  .breakdown-box {
    background: var(--soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
  }
  .breakdown-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
  }
  .breakdown-row:last-child { border-bottom: none; padding-bottom: 0; }
  .breakdown-label { font-size: 13px; color: var(--text-secondary); font-weight: 300; }
  .breakdown-value { font-size: 14px; font-weight: 500; color: var(--text); }
  .breakdown-value.plus { color: var(--green-dark); }
  .breakdown-value.minus { color: var(--danger); }
  .breakdown-total { font-size: 16px; font-weight: 700; color: var(--red); }

  /* TIMESHEET ROWS */
  .ts-item {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .ts-item:last-child { margin-bottom: 0; }
  .ts-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 5px;
  }
  .ts-date { font-size: 13px; font-weight: 500; color: var(--text); }
  .ts-day-total { font-size: 13px; font-weight: 600; color: var(--blue); }
  .ts-chips { display: flex; gap: 5px; flex-wrap: wrap; }
  .ts-chip {
    font-size: 11px; padding: 2px 7px;
    border-radius: 8px; font-weight: 400;
  }
  .tc-time { background: var(--soft); color: var(--text-secondary); border: 1px solid var(--border); }
  .tc-late { background: var(--danger-bg); color: var(--danger); }
  .tc-ot { background: var(--blue-bg); color: var(--blue); }
  .tc-ok { background: var(--green-bg); color: var(--green-dark); }

  /* ADJUST */
  .adjust-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .adjust-input {
    flex: 1; border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-family: 'Prompt', sans-serif;
    font-size: 14px; font-weight: 300;
    color: var(--text); background: var(--soft);
    outline: none;
  }
  .adjust-input:focus { border-color: var(--red); }
  .adjust-unit { font-size: 13px; color: var(--text-secondary); }

  .adjust-note {
    width: 100%; border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-family: 'Prompt', sans-serif;
    font-size: 13px; font-weight: 300;
    color: var(--text); background: var(--soft);
    outline: none; resize: none; margin-bottom: 14px;
  }
  .adjust-note:focus { border-color: var(--red); }

  /* SHEET ACTIONS */
  .sheet-actions { display: flex; gap: 10px; }
  .sheet-btn {
    flex: 1; border: none;
    border-radius: var(--radius-sm);
    padding: 14px;
    font-family: 'Prompt', sans-serif;
    font-size: 14px; font-weight: 500;
    cursor: pointer; transition: all 0.2s;
  }
  .sheet-btn:active { transform: scale(0.97); }
  .sheet-btn.close { background: var(--soft); color: var(--text-secondary); border: 1.5px solid var(--border); }
  .sheet-btn.confirm { background: var(--green); color: white; }
  .sheet-btn.confirm:disabled { background: #D1FAE5; color: #6EE7B7; cursor: not-allowed; }

  /* ─── EMPTY ─── */
  .empty-state { text-align: center; padding: 32px 20px; }
  .empty-icon { font-size: 32px; margin-bottom: 8px; }
  .empty-text { font-size: 13px; color: var(--text-secondary); font-weight: 300; }

  /* ─── TOAST / LOADING ─── */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--text); color: white;
    font-size: 13px; padding: 12px 20px;
    border-radius: 24px; z-index: 300;
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    white-space: nowrap; max-width: 90vw; text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { background: var(--green-dark); }
  .toast.error { background: var(--danger); }

  .loading-overlay {
    position: fixed; inset: 0;
    background: rgba(255,255,255,0.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .loading-overlay.show { opacity: 1; pointer-events: all; }

  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .divider { height: 1px; background: var(--border); margin: 4px 0 12px; }
</style>
</head>
<body>

<!-- ══════════════ HEADER ══════════════ -->
<div class="app-header" id="main-header">
  <div class="header-top">
    <div class="header-logo">EASY</div>
    <button class="logout-btn" onclick="logout()">ออกจากระบบ</button>
  </div>
  <div class="header-title">💰 Payroll</div>
  <div class="header-sub" id="header-sub">กำลังโหลด...</div>
</div>

<!-- ══════════════ MAIN PAGE ══════════════ -->
<div id="main-page">
  <div class="app-body" id="main-body">
    <div class="empty-state"><div class="spinner" style="margin:0 auto"></div></div>
  </div>
</div>

<!-- ══════════════ STAFF LIST PAGE ══════════════ -->
<div id="staff-list-page">
  <div class="app-header">
    <div class="header-top">
      <button class="back-btn-inline" onclick="backToMain()">← กลับ</button>
      <button class="logout-btn" onclick="logout()">ออกจากระบบ</button>
    </div>
    <div class="header-title" id="list-page-title">—</div>
    <div class="header-sub" id="list-page-sub">—</div>
  </div>
  <div class="app-body" id="staff-list-body"></div>
</div>

<!-- ══════════════ DETAIL SHEET ══════════════ -->
<div class="detail-overlay" id="detail-overlay" onclick="closeDetailOutside(event)">
  <div class="detail-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-avatar" id="d-avatar">—</div>
      <div>
        <div class="sheet-name" id="d-name">—</div>
        <div class="sheet-meta" id="d-meta">—</div>
      </div>
    </div>
    <div class="sheet-body" id="detail-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="loading-overlay" id="loading"><div class="spinner"></div></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxxTjC7xOGHlgyStVBf6SimoU5RA7xX3VPwxIUtfGlpMNO89OQPDaRewKDDEmWGK4kk/exec';
const SESSION_KEY = 'easy_session';

const THAI_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const THAI_DAYS_SHORT = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];

let allStaff = [];
let allTimesheets = [];
let settings = {};
let currentGroup = null; // 'fulltime' or 'parttime'
let currentStaffData = null;
let manualAdjust = 0;

// ─── DATE HELPERS ───
function toDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function thaiDate(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr + 'T00:00:00');
  return `${d.getDate()} ${THAI_MONTHS[d.getMonth()]} ${d.getFullYear()+543}`;
}

function formatMoney(n) {
  return '฿' + Number(n||0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// ─── PERIOD CALCULATOR ───
function getCurrentPeriods() {
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth();
  const d = now.getDate();
  const dow = now.getDay(); // 0=อา, 1=จ

  // Bimonthly: รอบปัจจุบัน
  let ftStart, ftEnd, ftPayDate;
  if (d <= 15) {
    ftStart = toDateStr(new Date(y, m, 1));
    ftEnd = toDateStr(new Date(y, m, 15));
    ftPayDate = toDateStr(new Date(y, m, 16));
  } else {
    const lastDay = new Date(y, m+1, 0).getDate();
    ftStart = toDateStr(new Date(y, m, 16));
    ftEnd = toDateStr(new Date(y, m, lastDay));
    ftPayDate = toDateStr(new Date(y, m+1, 1));
  }

  // Weekly: จันทร์–อาทิตย์ของอาทิตย์ปัจจุบัน
  const mondayOffset = dow === 0 ? -6 : 1 - dow;
  const mon = new Date(now);
  mon.setDate(now.getDate() + mondayOffset);
  const sun = new Date(mon);
  sun.setDate(mon.getDate() + 6);
  const nextMon = new Date(mon);
  nextMon.setDate(mon.getDate() + 7);

  const ptStart = toDateStr(mon);
  const ptEnd = toDateStr(sun);
  const ptPayDate = toDateStr(nextMon);

  // เช็คว่าใกล้วันจ่ายไหม (ภายใน 2 วัน)
  const todayStr = toDateStr(now);
  const ftIsPayDay = todayStr >= ftPayDate && todayStr <= addDays(ftPayDate, 1);
  const ptIsPayDay = dow === 1; // วันจันทร์ = วันจ่าย parttime

  return { ftStart, ftEnd, ftPayDate, ftIsPayDay, ptStart, ptEnd, ptPayDate, ptIsPayDay };
}

function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return toDateStr(d);
}

function periodLabel(start, end) {
  const s = new Date(start + 'T00:00:00');
  const e = new Date(end + 'T00:00:00');
  if (s.getMonth() === e.getMonth()) {
    return `${s.getDate()}–${e.getDate()} ${THAI_MONTHS[s.getMonth()]} ${s.getFullYear()+543}`;
  }
  return `${s.getDate()} ${THAI_MONTHS[s.getMonth()]} – ${e.getDate()} ${THAI_MONTHS[e.getMonth()]} ${e.getFullYear()+543}`;
}

// ─── PAYROLL CALC ───
function calcPayroll(staff, timesheets, periodStart, periodEnd) {
  const ts = timesheets.filter(t => {
    const td = typeof t.date === 'string' ? t.date.substring(0,10) : toDateStr(new Date(t.date));
    return t.staff_id === staff.staff_id && td >= periodStart && td <= periodEnd;
  });

  const rate = parseFloat(staff.rate) || 0;
  const otRatePerHour = parseFloat(settings.ot_rate_per_hour) || 50;
  const lateGrace = parseInt(settings.late_grace_min) || 15;

  let basePay = 0, otPay = 0, lateDeduct = 0;
  let daysWorked = 0, hoursWorked = 0;
  let details = [];
  let pendingOTs = [];

  ts.forEach(t => {
    if (!t.clock_in) return;
    const lateMin = parseInt(t.late_min) || 0;
    const otHours = parseFloat(t.ot_hours) || 0;
    const otApproved = t.ot_status === 'approved';
    const otPending = t.ot_status === 'pending';

    let dayBase = 0, dayDeduct = 0, dayOT = 0;

    if (staff.pay_type === 'daily') {
      dayBase = rate;
      daysWorked++;
      if (lateMin > lateGrace) {
        const minsPerDay = 8 * 60;
        dayDeduct = parseFloat(((rate / minsPerDay) * lateMin).toFixed(2));
        lateDeduct += dayDeduct;
      }
    } else {
      const hrs = parseFloat(t.hours_worked) || 0;
      dayBase = parseFloat((rate * hrs).toFixed(2));
      hoursWorked += hrs;
    }

    if (otHours > 0 && otApproved) {
      dayOT = parseFloat((otHours * otRatePerHour).toFixed(2));
      otPay += dayOT;
    }

    if (otPending) {
      pendingOTs.push({
        record_id: t.record_id,
        date: t.date,
        ot_hours: otHours,
        ot_reason: t.ot_reason || '—'
      });
    }

    basePay += dayBase;
    details.push({
      date: t.date, clock_in: t.clock_in, clock_out: t.clock_out,
      hours: staff.pay_type === 'daily' ? 8 : (parseFloat(t.hours_worked)||0),
      late_min: lateMin, late_deduct: dayDeduct,
      ot_hours: otHours, ot_pay: dayOT, ot_status: t.ot_status,
      ot_reason: t.ot_reason, record_id: t.record_id,
      day_total: parseFloat((dayBase - dayDeduct + dayOT).toFixed(2))
    });
  });

  const total = parseFloat((basePay - lateDeduct + otPay).toFixed(2));
  return { staff, days_worked: daysWorked, hours_worked: parseFloat(hoursWorked.toFixed(2)), base_pay: parseFloat(basePay.toFixed(2)), ot_pay: parseFloat(otPay.toFixed(2)), late_deduct: parseFloat(lateDeduct.toFixed(2)), total, details, pendingOTs, ts_count: ts.length };
}

async function openGroup(type) {

  const end = isFulltime ? periods.ftEnd : periods.ptEnd;
  const payDate = isFulltime ? periods.ftPayDate : periods.ptPayDate;

  // โหลด timesheets ใหม่สำหรับรอบนี้
  try {
    const res = await apiGet(`action=getTimesheets&date_from=${start}&date_to=${end}`);
    allTimesheets = res.success ? res.data : [];
  } catch {}

  const payrolls = staff.map(s => calcPayroll(s, allTimesheets, start, end));

  // update header
  document.getElementById('list-page-title').textContent = isFulltime ? '💼 พนักงานประจำ' : '👤 Part-time';
  document.getElementById('list-page-sub').textContent = `${periodLabel(start, end)} · จ่าย ${thaiDate(payDate)}`;

  let html = '';

  if (!payrolls.length) {

  } else {
    payrolls.forEach(p => {
      const initials = (p.staff.nickname || p.staff.name || '?').charAt(0);
      const workLabel = isFulltime ? `${p.days_worked} วัน` : `${p.hours_worked} ชม.`;
      const hasPendingOT = p.pendingOTs.length > 0;
      const hasLate = p.late_deduct > 0;
      const isEmpty = p.ts_count === 0;

      let statusClass = 'status-ready';
      let statusLabel = '📋 พร้อมจ่าย';
      if (isEmpty) { statusClass = 'status-missing'; statusLabel = '⚠️ ไม่มีข้อมูล'; }

      html += `
        <div class="staff-card" onclick="openDetail('${p.staff.staff_id}', '${start}', '${end}', '${payDate}')">
          <div class="staff-card-top">
            <div class="staff-avatar">${initials}</div>
            <div class="staff-info">
              <div class="staff-name">${p.staff.nickname || p.staff.name}</div>
              <div class="staff-meta">${isFulltime ? `฿${p.staff.rate}/วัน` : `฿${p.staff.rate}/ชม.`} · ${workLabel}</div>
            </div>
            <div class="staff-amount-wrap">
              <div class="staff-amount">${formatMoney(p.total)}</div>
              <div class="staff-amount-label">ยอดสุทธิ</div>
            </div>
          </div>
          <div class="staff-card-bottom">
            <div class="staff-chips">
              ${hasLate ? `<span class="chip chip-late">หัก ฿${p.late_deduct.toFixed(0)}</span>` : ''}
              ${p.ot_pay > 0 ? `<span class="chip chip-ot">OT ฿${p.ot_pay.toFixed(0)}</span>` : ''}
              ${hasPendingOT ? `<span class="chip chip-ot-pending">⏰ OT รออนุมัติ</span>` : ''}
              ${!hasLate && !p.ot_pay && !hasPendingOT && !isEmpty ? `<span class="chip chip-ok">ปกติ</span>` : ''}
            </div>
            <div class="staff-status ${statusClass}">${statusLabel}</div>
          </div>
        </div>
      `;
    });
  }

  document.getElementById('staff-list-body').innerHTML = html;

  // switch page
  document.getElementById('main-page').style.display = 'none';
  document.getElementById('main-header').style.display = 'none';

  showLoading(false);

function liveAdjust(val) {
  manualAdjust = parseFloat(val) || 0;
  const note = document.getElementById('adjust-note')?.value || '';
  renderDetailBody();
  setTimeout(() => {
    const inp = document.getElementById('adjust-amount');
    if (inp) { inp.focus(); inp.value = val; }
    const noteEl = document.getElementById('adjust-note');
    if (noteEl) noteEl.value = note;
  }, 10);
}

async function approveOT(recordId, approve) {
  showLoading(true);
  try {
    await apiPost({ action: 'updateTimesheetOT', record_id: recordId, ot_status: approve ? 'approved' : 'rejected' });
    showToast(approve ? '✅ อนุมัติ OT แล้ว' : '❌ ปฏิเสธ OT แล้ว', approve ? 'success' : '');
    const res = await apiGet(`action=getTimesheets&date_from=${currentStaffData.start}&date_to=${currentStaffData.end}`);
    allTimesheets = res.success ? res.data : [];
    const updated = calcPayroll(currentStaffData.payroll.staff, allTimesheets, currentStaffData.start, currentStaffData.end);
    currentStaffData.payroll = updated;
    renderDetailBody();
  } catch { showToast('เกิดข้อผิดพลาด', 'error'); }
  showLoading(false);
}

async function confirmPayroll() {
  if (!currentStaffData) return;
  const { payroll, start, end, payDate } = currentStaffData;
  const adjustNote = document.getElementById('adjust-note')?.value || '';
  const totalWithAdjust = payroll.total + manualAdjust;

  showLoading(true);
  try {
    await apiPost({
      action: 'savePayrollRun',
      staff_id: payroll.staff.staff_id,
      period_start: start,
      period_end: end,
      pay_date: payDate,
      days_worked: payroll.days_worked,
      hours_worked: payroll.hours_worked,
      base_pay: payroll.base_pay,
      ot_pay: payroll.ot_pay,
      late_deduct: payroll.late_deduct,
      early_out_deduct: 0,
      manual_adjust: manualAdjust,
      adjust_note: adjustNote,
      total_pay: totalWithAdjust,
      status: 'paid',
      paid_at: new Date().toISOString()
    });
    showToast(`✅ บันทึกจ่าย ${formatMoney(totalWithAdjust)} เรียบร้อย`, 'success');
    closeDetail();
    // reload
    await openGroup(currentGroup);
  } catch { showToast('เกิดข้อผิดพลาด', 'error'); }
  showLoading(false);
}

function closeDetail() { document.getElementById('detail-overlay').classList.remove('visible'); }
function closeDetailOutside(e) { if (e.target === document.getElementById('detail-overlay')) closeDetail(); }
function scrollToOT() { openGroup(currentGroup || 'fulltime'); }

// ─── SESSION / LOGOUT ───
function logout() {
  localStorage.removeItem(SESSION_KEY);
  window.location.href = '/index.html';
}

// ─── API ───
async function apiGet(p) { const r = await fetch(`${API_URL}?${p}`); return r.json(); }
async function apiPost(b) { const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(b) }); return r.json(); }

// ─── UI ───
function showLoading(s) { document.getElementById('loading').classList.toggle('show', s); }
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3500);
}

  const raw = localStorage.getItem(SESSION_KEY);
  if (!raw) { window.location.href = '/index.html'; return; }
  try {
    const session = JSON.parse(raw);
    if (Date.now() > session.expires) { localStorage.removeItem(SESSION_KEY); window.location.href = '/index.html'; return; }
    if (session.role !== 'admin') { window.location.href = '/clock.html'; return; }
  } catch { window.location.href = '/index.html'; return; }

  showLoading(true);
  try {
    const [staffRes, settingsRes, tsRes] = await Promise.all([
      apiGet('action=getStaff'),
      apiGet('action=getSettings'),
      apiGet(`action=getTimesheets&date_from=${addDays(toDateStr(new Date()), -31)}&date_to=${toDateStr(new Date())}`)
    ]);
    allStaff = staffRes.success ? staffRes.data : [];
    settings = settingsRes.success ? settingsRes.data : {};
    allTimesheets = tsRes.success ? tsRes.data : [];
    renderMainPage();
  } catch { showToast('โหลดข้อมูลไม่สำเร็จ', 'error'); }
  showLoading(false);
});
</script>
</body>
</html>
